events {
    worker_connections 1024;
}

http {
    # ==========================================================================
    # PRODUCTION RESERVE SERVER (Server 2)
    # Primaer: Lokaler Production Worker
    # Fallback: Server 1 (Primary Bridge) wenn lokaler Worker down
    # ==========================================================================

    # max_fails=0 across the board: intentional 503/429 (rate-limit penalty)
    # does not flip a worker to "down", so parallel monitoring polls never hit
    # an empty pool. Per-request failover still works via proxy_next_upstream.

    # Lokaler Production Worker
    upstream local_worker {
        server worker-prod:8000 max_fails=0;
        keepalive 16;
    }

    # Metrics Reader (JSONL-based historical metrics)
    upstream metrics_reader {
        server metrics-reader-prod:8000 max_fails=0;
        keepalive 4;
    }

    # Fallback: Server 1 (Primary Bridge) — nur wenn lokal alles down
    # BRIDGE_PRIMARY_HOST muss als env var gesetzt sein (wird via envsubst ersetzt)
    upstream primary_bridge {
        server ${BRIDGE_PRIMARY_HOST}:8000 max_fails=0;
        keepalive 8;
    }

    # Combined: Lokal zuerst, dann Server 1 als Backup
    upstream production_with_fallback {
        server worker-prod:8000 max_fails=0;
        server ${BRIDGE_PRIMARY_HOST}:8000 backup;
        keepalive 16;
    }

    # ==========================================================================
    # Logging
    # ==========================================================================
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                           '$status $body_bytes_sent '
                           '"$http_user_agent" '
                           'upstream: $upstream_addr '
                           'response_time: $upstream_response_time';

    # JSONL — same shape as primary nginx.conf, consumed by CUI Error-Panel via rsync.
    # "bridge" identifies this server as "prod" (production-reserve).
    log_format upstream_jsonl escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"ts_epoch":$msec,'
          '"remote":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"req_time":$request_time,'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_status":"$upstream_status",'
          '"upstream_resp_time":"$upstream_response_time",'
          '"upstream_conn_time":"$upstream_connect_time",'
          '"pool":"local_worker",'
          '"priority":"$http_x_priority",'
          '"bridge":"${BRIDGE_ID}",'
          '"user_agent":"$http_user_agent",'
          '"app_id":"$http_x_app_id",'
          '"user_id":"$http_x_user_id",'
          '"workflow_id":"$http_x_workflow_id",'
          '"job_id":"$http_x_job_id",'
          '"agent_id":"$http_x_agent_id"'
        '}';

    access_log /dev/stdout upstream_log;
    access_log /var/log/nginx/access.jsonl upstream_jsonl;
    error_log /var/log/nginx/error.log warn;

    # ==========================================================================
    # Server Configuration
    # ==========================================================================
    server {
        listen 80;
        server_name _;

        proxy_connect_timeout 60s;
        proxy_send_timeout 2500s;
        proxy_read_timeout 2500s;
        send_timeout 2500s;

        proxy_buffering off;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        proxy_next_upstream error timeout http_500 http_502 http_503 http_504 http_429;
        proxy_next_upstream_timeout 120s;
        proxy_next_upstream_tries 2;

        # =======================================================================
        # BRIDGE CAPACITY CONTRACT (Phase 2)
        # Client-facing contract: EITHER 2xx OR 429 — never 5xx. See nginx.conf
        # for full rationale. After failover exhausts all upstreams, the final
        # 5xx is intercepted and rewritten to the canonical @bridge_full envelope.
        # =======================================================================
        proxy_intercept_errors on;

        # =======================================================================
        # Health Check
        # =======================================================================
        location = /health {
            proxy_pass http://local_worker/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # /lb-status is now served by metrics-reader (see above)

        # =======================================================================
        # Direct Worker Access
        # =======================================================================
        location /worker-prod/ {
            rewrite ^/worker-prod/(.*)$ /$1 break;
            proxy_pass http://worker-prod:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # =======================================================================
        # Metrics Reader Endpoints (JSONL-based, persistent)
        # =======================================================================
        location ~ ^/v1/metrics/(prompt-performance|throughput|usage-breakdown|request-log|cc-usage-history|contract|limiter-trajectory|upstream-health) {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_read_timeout 30s;
        }

        location = /lb-status {
            proxy_pass http://metrics_reader/lb-status;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =======================================================================
        # SSE/Streaming Endpoints — mit Fallback auf Server 1
        # =======================================================================
        location ~ ^/v1/(chat/completions|research) {
            proxy_pass http://production_with_fallback;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Bridge-Server "production-reserve" always;

            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 2500s;

            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;

            proxy_next_upstream error timeout http_502 http_503 http_504 http_429 non_idempotent;
            proxy_next_upstream_timeout 120s;
            proxy_next_upstream_tries 2;

            # Capacity contract — after failover exhausts, rewrite to 429 envelope.
            error_page 500 502 503 504 = @bridge_full;
        }

        # =======================================================================
        # Default — mit Fallback auf Server 1
        # =======================================================================
        location / {
            proxy_pass http://production_with_fallback;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Bridge-Server "production-reserve" always;

            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;

            # Capacity contract — see chat/research location.
            error_page 500 502 503 504 = @bridge_full;
        }

        # =======================================================================
        # @bridge_full — Canonical "bridge capacity full" envelope (429)
        # Same shape as nginx.conf — envelope matches src/middleware/bridge_error.py.
        # =======================================================================
        location @bridge_full {
            internal;
            default_type application/json;
            add_header Retry-After 30 always;
            add_header X-Bridge-Capacity "exhausted" always;
            return 429 '{"error":{"message":"[Bridge nginx-prod] Bridge capacity full — all workers exhausted or rate-limited. Retry in ~30s.","type":"api_error","code":"429","source":"bridge_nginx","bridge_type":"capacity_full","reason":"all_workers_exhausted","retryable":true,"retry_after_s":30,"bridge_worker":"nginx-lb-prod","timestamp":0}}';
        }
    }
}
