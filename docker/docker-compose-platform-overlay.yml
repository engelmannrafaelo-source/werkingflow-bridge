# =============================================================================
# Bridge Platform-Layer — Overlay for docker-compose.yml
#
# Adds:
#   1) env_file (platform secrets) to all live workers — still needed for
#      the budget gate + activity tracking pool that workers keep in phase-1.
#   2) platform-api service — the new dedicated container for all DB-backed
#      HTTP routes (/v1/auth/*, /v1/users*, /v1/billing/*, etc.).
#
# Zero-downtime migration sequence:
#   a) Deploy platform-api (new service, additive)
#   b) Update nginx to route platform paths → platform-api
#   c) Rebuild workers without the router mounts (already done in main.py)
#
# See: /root/orchestrator/workspaces/devops/specs/bridge-platform-split/PLAN.md
# =============================================================================

services:
  # Workers keep platform.env for budget gate + activity tracking (phase-1).
  # Phase-2: remove env_file from workers once budget gate is an HTTP call.
  worker1:
    env_file:
      - ../secrets/platform.env
    networks:
      - bridge-net
      - bridge-prod-net    # access to postgres-prod
  worker2:
    env_file:
      - ../secrets/platform.env
    networks:
      - bridge-net
      - bridge-prod-net
  worker3:
    env_file:
      - ../secrets/platform.env
    networks:
      - bridge-net
      - bridge-prod-net
  worker4:
    env_file:
      - ../secrets/platform.env
    networks:
      - bridge-net
      - bridge-prod-net

  # =============================================================================
  # platform-api — Dedicated DB-backed platform layer (no LLM SDK, no Node)
  # Serves: /v1/auth/*, /v1/users*, /v1/billing/*, /v1/budget/*, /v1/activity/*,
  #         /v1/audit/*, /v1/feedback, /v1/dev-tokens/*, /v1/stammdaten/*,
  #         /v1/invoices/*, /v1/system/*, /v1/impersonation/*, /v1/app-licenses,
  #         /v1/db/health, /v1/sandbox/conversations/*
  # =============================================================================
  platform-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.platform
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: wt-platform-api
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M
    # Sandbox lease (/v1/sandbox/lease-token) reads OAuth tokens from
    # BRIDGE_SECRETS_DIR/claude_token_<account>.txt. Same convention as workers,
    # so the platform-api sees the same symlink set (engelmann → account1, etc.).
    volumes:
      - /root/werkingflow-bridge/secrets:/app/secrets:ro
    env_file:
      - ../secrets/platform.env
    environment:
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - LOG_TO_FILE=false
      - FILTER_SENSITIVE_DATA=true
      - CORS_ORIGINS=["*"]
      - BRIDGE_SECRETS_DIR=/app/secrets
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - bridge-net
      - bridge-prod-net

networks:
  bridge-prod-net:
    external: true
    name: docker_bridge-prod-net
