  # Privacy + PDF Service (HEAVY — single instance, Presidio + spaCy + Docling)
  # =============================================================================
  privacy-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.privacy-pdf
    container_name: eco-privacy-pdf-service
    expose:
      - "8100"
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G
    environment:
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - PRIVACY_ENABLED=true
      - PRIVACY_LANGUAGE=de
      - PRIVACY_LOG_DETECTIONS=false
      # Smart-anonymize self-calls back to workers via nginx
      - BRIDGE_SELF_URL=http://nginx:80/v1/chat/completions
      - API_KEY=${API_KEY:-}
      - CONVERTAPI_SECRET=${CONVERTAPI_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - bridge-net

  # =============================================================================
  # Metrics Reader — decoupled read-only historical metrics service
  # =============================================================================
  # Survives worker crashes / 503-storms. Serves /v1/metrics/* endpoints from
  # JSONL on disk so the CUI Bridge Monitor keeps working even when the whole
  # worker pool is down. Volume is mounted READ-ONLY as defence-in-depth.
  metrics-reader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.metrics-reader
    container_name: eco-wrapper-metrics-reader
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 1536M
        reservations:
          memory: 256M
    volumes:
      # READ-ONLY mount — reader must never write to the metrics volume.
      - eco-wrapper-logs:/app/logs:ro
    environment:
      - METRICS_DIR=/app/logs
      - LOG_LEVEL=INFO
      - TZ=Europe/Vienna
      # Aggregate metrics from production server (Server 2) if configured
      - BRIDGE_PROD_URL=${BRIDGE_PROD_URL:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - bridge-net

networks:
  bridge-net:
    driver: bridge

volumes:
  eco-wrapper-logs:
    driver: local
  eco-wrapper-instances-shared:
    driver: local

secrets:
