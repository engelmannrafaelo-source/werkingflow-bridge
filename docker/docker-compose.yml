services:
  # =============================================================================
  # NGINX Load Balancer - Round-Robin über 3 aktive Worker
  # =============================================================================
  nginx:
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx-lb
    container_name: eco-wrapper-lb
    ports:
      - "8000:80"      # Primary API
      - "8010:80"      # eco-backend compatibility
      - "8020:80"      # eco-diagnostics compatibility
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ../logs/nginx:/var/log/nginx
    environment:
      - BRIDGE_PROD_HOST=${BRIDGE_PROD_HOST:-127.0.0.1}
      - BRIDGE_ID=${BRIDGE_ID:-dev}
    # envsubst resolves ${BRIDGE_PROD_HOST} and ${BRIDGE_ID} in nginx.conf, then start openresty
    command: ["/bin/sh", "-c", "envsubst '$$BRIDGE_PROD_HOST $$BRIDGE_ID' < /etc/nginx/nginx.conf > /tmp/nginx.conf && openresty -c /tmp/nginx.conf -g 'daemon off;'"]
    depends_on:
      - worker1
      - worker2
      - worker3
      - worker4
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - bridge-net

  # =============================================================================
  # Worker 1 - Account 1: rafael@engelmann.at (LIGHTWEIGHT — no Presidio/Docling)
  # =============================================================================
  worker1:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: eco-wrapper-worker1
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - eco-wrapper-logs:/app/logs
      - eco-wrapper-instances-shared:/app/instances
      - ~/eco-research-output:/app/research_output
      - /root/.claude/commands/sc:/home/claude/.claude/commands/sc:ro
      - /root/.claude/agents:/home/claude/.claude/agents:ro
      - /root/.claude/superclaude:/home/claude/.claude/superclaude:ro
    secrets:
      - claude_token_1
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN_FILE=/run/secrets/claude_token_1
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - LOG_TO_FILE=true
      - FILTER_SENSITIVE_DATA=true
      - INSTANCE_NAME=worker1
      - ADAPTIVE_INITIAL_CAP_TOKENS=1000000
      - ADAPTIVE_FLOOR_TOKENS=500000
      - ADAPTIVE_CEILING_TOKENS=4000000
      - ADAPTIVE_GROW_TRIGGER_SEC=300
      - ADAPTIVE_GROW_FACTOR=1.10
      - ADAPTIVE_QUEUE_WAIT_SEC=5
      - ADAPTIVE_WEEKLY_PREDICTIVE_THROTTLE=true
      - CLAUDE_CWD=/app/instances
      - DISABLE_COACH_MCP=true
      - MAX_TIMEOUT=2400000
      - CLAUDE_PERMISSION_MODE=bypassPermissions
      - ANTHROPIC_VISION_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PRIVACY_ENABLED=true
      - PRIVACY_LANGUAGE=de
      - PRIVACY_LOG_DETECTIONS=false
      - SKIP_SDK_VERIFICATION=true
      - RATE_LIMIT_ENABLED=false
      - DEFAULT_PRIVACY_MODE=none
      - PRIVACY_SERVICE_URL=http://privacy-service:8100
      - AI_BRIDGE_URL_PROD_FALLBACK=${AI_BRIDGE_URL_PROD_FALLBACK:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - bridge-net

