      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    restart: unless-stopped
    networks:
      - bridge-net
      - bridge-prod-net

  # =============================================================================
  # Worker 4 - Account 4: dev-server account (claude_token_account4.txt / Oezp)
  # =============================================================================
  worker4:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: wt-wrapper-worker4
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - /root/werkingflow-bridge/secrets:/app/secrets:ro
      - wt-wrapper-logs:/app/logs
      - wt-wrapper-instances-shared:/app/instances
      - ~/eco-research-output:/app/research_output
      - /root/.claude/commands/sc:/home/claude/.claude/commands/sc:ro
      - /root/.claude/agents:/home/claude/.claude/agents:ro
      - /root/.claude/superclaude:/home/claude/.claude/superclaude:ro
    secrets:
      - claude_token_4
    env_file:
      - ../secrets/platform.env
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN_FILE=/run/secrets/claude_token_4
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - LOG_TO_FILE=true
      - FILTER_SENSITIVE_DATA=true
      - BRIDGE_SECRETS_DIR=/app/secrets
      - BRIDGE_ANONYMIZE_ENABLED=true
      - INSTANCE_NAME=worker4
      # claude.ai account whose OAuth token this worker uses. Per-host
      # topology (like INSTANCE_NAME), therefore config — NOT a map in
      # shared code. Must match the `account` field the usage scraper
      # publishes, otherwise this worker's usage reports as UNKNOWN.
      - WORKER_ACCOUNT=werking
      - BRIDGE_GENERIC_JOBS_ENABLED=true
      # OA-Scholarly-Schicht (nur DEV/hetzner — diese Compose ist hetzner-only, PROD nutzt
      # docker-compose-prod.yml). Aktiviert die legale OA-Volltext-Injektion bei research_mode=academic.
      - BRIDGE_SCHOLARLY_ENABLED=true
      # CORE keyless works without this (lower rate-limit, fail-soft -> []). Empty default is
      # safe/expected until the CORE_API_KEY registration (running in parallel) lands in Infisical.
      - CORE_API_KEY=${CORE_API_KEY:-}
      # Bridge-owned per-(app,agent) tier routing/billing policy (master switch).
      # Per-route control is the app_tier_policies DB table (enabled column).
      # Fail-open: no matching row / unusable target tier → normal routing.
      - BRIDGE_APP_TIER_POLICY_ENABLED=true
      # Prepaid Anthropic vision-key daily spend cap (fail-open, read per-call).
      # Guards the vision_prepaid lane — real prepaid money the ledger books as 0€.
      # Kill switch: set ENABLED=false + recreate. See src/routing/prepaid_cap.py.
      - PREPAID_VISION_DAILY_CAP_ENABLED=true
      - PREPAID_VISION_DAILY_CAP_EUR=90
      # Chat-job self-call timeout (claims/finalize). Default 600s cut long
      # Energy claims calls (observed 728s); align with MAX_TIMEOUT (2400s).
      - BRIDGE_CHAT_JOB_TIMEOUT_S=2400
      - ADAPTIVE_INITIAL_CAP_TOKENS=1000000
      - ADAPTIVE_FLOOR_TOKENS=500000
      - ADAPTIVE_CEILING_TOKENS=4000000
      - ADAPTIVE_GROW_TRIGGER_SEC=300
      - ADAPTIVE_GROW_FACTOR=1.10
      - ADAPTIVE_QUEUE_WAIT_SEC=5
      - ADAPTIVE_WEEKLY_PREDICTIVE_THROTTLE=true
      - CLAUDE_CWD=/app/instances
      - DISABLE_COACH_MCP=true
      - MAX_TIMEOUT=2400000
      # Anthropic-client request timeout INSIDE the claude CLI subprocess.
      # Unset, the CLI defaults to 600000ms (10 min) and aborts slow streams
      # mid-generation -> partial content without result message (silent
      # truncation upstream of MAX_TIMEOUT). Align with MAX_TIMEOUT so the
      # bridge's own asyncio timeout is the single governing limit.
      - API_TIMEOUT_MS=2400000
      # Central output-token ceiling (target architecture 2026-06-12): app
      # code sends NO max_tokens (the SDK path ignores it anyway) — this env
      # on the CLI subprocess is the single limit. 64000 = Sonnet 4.5 /
      # Haiku 4.5 ceiling (Opus 4.8 allows more). Without it the CLI default
      # (32000) silently caps long structured outputs.
      - CLAUDE_CODE_MAX_OUTPUT_TOKENS=64000
      - CLAUDE_PERMISSION_MODE=bypassPermissions
      - ANTHROPIC_VISION_API_KEY=${ANTHROPIC_API_KEY}
      # research-cloud (Weg C): executor-only key alias + feature flag.
      # NEVER add plain ANTHROPIC_API_KEY here — claude_cli.py fatals on it
      # (subscription pool would silently bill the API otherwise).
      - RESEARCH_CLOUD_API_KEY=${ANTHROPIC_API_KEY:-}
      - RESEARCH_CLOUD_ENABLED=${RESEARCH_CLOUD_ENABLED:-}
      # Research-Library (specs/research-library-tool): kuratierte private
      # Bibliothek fuer den research_cloud-Pfad; default aus, Werte via
      # sync-infisical-to-bridge -> docker/.env (dev) bzw. platform-Secrets (prod).
      - RESEARCH_LIBRARY_ENABLED=${RESEARCH_LIBRARY_ENABLED:-}
      - RESEARCH_LIBRARY_S3_ENDPOINT_URL=${RESEARCH_LIBRARY_S3_ENDPOINT_URL:-}
      - RESEARCH_LIBRARY_S3_BUCKET=${RESEARCH_LIBRARY_S3_BUCKET:-}
      - RESEARCH_LIBRARY_S3_ACCESS_KEY_ID=${RESEARCH_LIBRARY_S3_ACCESS_KEY_ID:-}
      - RESEARCH_LIBRARY_S3_SECRET_ACCESS_KEY=${RESEARCH_LIBRARY_S3_SECRET_ACCESS_KEY:-}
      - RESEARCH_LIBRARY_S3_REGION=${RESEARCH_LIBRARY_S3_REGION:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # STT / Whisper EU data-residency (GDPR) — default openai (US, backward-compat).
      # EU route (Rafael 2026-07-06): STT_PROVIDER=aws-sagemaker + AWS_STT_SAGEMAKER_ENDPOINT
      # (self-hosted Whisper on SageMaker EU, reuses the Bedrock AWS creds from env_file);
      # or OPENAI_STT_BASE_URL=https://eu.api.openai.com/v1 for OpenAI's own EU residency.
      - STT_PROVIDER=${STT_PROVIDER:-openai}
      - OPENAI_STT_BASE_URL=${OPENAI_STT_BASE_URL:-}
      - OPENAI_STT_MODEL=${OPENAI_STT_MODEL:-}
      - AWS_STT_SAGEMAKER_ENDPOINT=${AWS_STT_SAGEMAKER_ENDPOINT:-}
      - AWS_STT_REGION=${AWS_STT_REGION:-}
      - PRIVACY_ENABLED=true
      - PRIVACY_LANGUAGE=de
      - PRIVACY_LOG_DETECTIONS=false
      - SKIP_SDK_VERIFICATION=true
      - RATE_LIMIT_ENABLED=false
      - DEFAULT_PRIVACY_MODE=none
      - PRIVACY_SERVICE_URL=${PRIVACY_SERVICE_URL:-http://privacy-service:8100}
      - PRIVACY_SERVICE_FALLBACK_URL=${PRIVACY_SERVICE_FALLBACK_URL:-}
      - AI_BRIDGE_URL_PROD_FALLBACK=${AI_BRIDGE_URL_PROD_FALLBACK:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    restart: unless-stopped
    networks:
      - bridge-net
      - bridge-prod-net

  # =============================================================================
  # Privacy + PDF Service (HEAVY — single instance, Presidio + spaCy + Docling)
  # =============================================================================
  privacy-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile.privacy-pdf
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: wt-privacy-pdf-service
    expose:
      - "8100"
    # Tailscale-only host publish so the PROD bridge (server2, 7GB host can't run
    # the ~13GB Flair model) can route smart-anonymize here. Bound to the dev
    # Tailscale IP — NOT 0.0.0.0 — so it stays inside the private mesh.
    ports:
      - "100.112.98.39:8100:8100"
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
    environment:
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - PRIVACY_ENABLED=true
      - PRIVACY_LANGUAGE=de
      - PRIVACY_LOG_DETECTIONS=false
      # GPU rollout (2026-07-28): Flair NER can run on CUDA instead of CPU —
      # see src/privacy/flair_recognizer.py. Unset here on purpose: this
      # compose file builds Dockerfile.privacy-pdf with the default
      # TORCH_VARIANT=cpu (no GPU on this host), so PRIVACY_DEVICE defaults
      # to "auto" -> CPU, i.e. unchanged behaviour. A GPU host builds the
      # image with --build-arg TORCH_VARIANT=cuda, sets PRIVACY_DEVICE=cuda
      # (fails loud instead of silently running on CPU if no GPU is visible
      # there), and raises SMART_ANONYMIZE_MAX_CONCURRENT together with
      # SMART_ANONYMIZE_EXECUTOR_WORKERS (both default to today's CPU-era
      # value of 2 if unset) — via its own env/compose override, not here.
      # ONE worker process: each uvicorn worker holds its own copy of the Flair
      # XLM-R-large stack (~5.5-7GB warm, growing). With 2 workers the combined
      # baseline (~12.6GB observed) left so little of the 16G cgroup that one
      # large smart-anonymize request (>10GB peak RSS) got OOM-killed
      # mid-request (dmesg 2026-07-03 09:39:48Z; 15 worker deaths on 2026-07-02
      # alone) — callers saw "Server disconnected". Concurrency inside the
      # process stays: Presidio thread pool + DOCLING_THREADS release the GIL.
      - UVICORN_WORKERS=1
      - DOCLING_THREADS=4
      # Used by the PDF-conversion adapter (markdown prompt self-call via nginx)
      - BRIDGE_SELF_URL=http://nginx:80/v1/chat/completions
      - API_KEY=${API_KEY:-}
      - CONVERTAPI_SECRET=${CONVERTAPI_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Image/Vision descriptions (describe_images) require a DIRECT Anthropic
      # API key — VisionProvider reads ONLY this var (never ANTHROPIC_API_KEY).
      # Same aliasing the worker services use; without it every describe_images
      # call raised ValueError, surfaced misleadingly as a 503 "at capacity".
      - ANTHROPIC_VISION_API_KEY=${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    restart: unless-stopped
    networks:
      - bridge-net

  # =============================================================================
  # Metrics Reader — decoupled read-only historical metrics service
  # =============================================================================
  # Survives worker crashes / 503-storms. Serves /v1/metrics/* endpoints from
  # JSONL on disk so the CUI Bridge Monitor keeps working even when the whole
  # worker pool is down. Volume is mounted READ-ONLY as defence-in-depth.
  metrics-reader:
    build:
      context: ..
      dockerfile: docker/Dockerfile.metrics-reader
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: wt-wrapper-metrics-reader
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          # 22.07.: 1536M reichte nicht — parallele Dashboard-Polls der
          # Heavy-Endpoints OOM-killten den uvicorn-Child im Minutentakt
          # (Reader 30-60s taub → Sandbox-Leases 503). Headroom verdoppelt;
          # der eigentliche Fix ist die tail-bounded Query + TTL-Cache.
          memory: 3072M
        reservations:
          memory: 256M
    volumes:
      # READ-ONLY mount — reader must never write to the metrics volume.
      - wt-wrapper-logs:/app/logs:ro
    environment:
      - METRICS_DIR=/app/logs
      - LOG_LEVEL=INFO
      - TZ=Europe/Vienna
      # Aggregate metrics from production server (Server 2) if configured
      - BRIDGE_PROD_URL=${BRIDGE_PROD_URL:-}
    healthcheck:
      # Echten Aggregationspfad pruefen, nicht nur den uvicorn-Master:
      # /health antwortete "healthy", waehrend der OOM-gekillte Child keinen
      # einzigen pool-state Request mehr beantwortete (22.07.). Worst case
      # des Endpoints: 4 Worker-Polls x 3s → max-time 13s, timeout 15s.
      test: ["CMD", "curl", "-fsS", "--max-time", "13", "http://localhost:8000/v1/metrics/account-pool-state"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - bridge-net

networks:
  bridge-net:
    driver: bridge
  bridge-prod-net:
    external: true
    name: docker_bridge-prod-net

volumes:
  # Fixed volume names — independent of the compose project name. Without an
  # explicit `name:` field, docker prefixes the volume with the current
  # project (basename of cwd), so running compose from /root/werkingflow-bridge/
  # vs /root/werkingflow-bridge/docker/ produced two separate volume sets
  # (docker_eco-wrapper-logs vs werkingflow-bridge_eco-wrapper-logs). Locking
  # the name makes the data the source of truth, not the cwd.
  wt-wrapper-logs:
    driver: local
    name: wt-wrapper-logs
  wt-wrapper-instances-shared:
    driver: local
    name: wt-wrapper-instances-shared

secrets:
  claude_token_1:
    file: ../secrets/claude_token_account1.txt    # rafael@engelmann.at
  claude_token_2:
    file: ../secrets/claude_token_account3.txt    # office@data-energyneering.at
  claude_token_3:
    file: ../secrets/claude_token_account2.txt    # engelmann.rafaelo@gmail.com
  claude_token_4:
    file: ../secrets/claude_token_account4.txt    # dev-server account / 4. Token (Apr 16, sk-ant-oat01-Oezp)
