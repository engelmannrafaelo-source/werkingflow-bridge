# Simple Nginx Proxy - Bedrock routing handled by FastAPI
# No Lua needed, just forward all requests to the wrapper

events {
    worker_connections 1024;
}

http {
    upstream claude_wrapper {
        server eco-wrapper:8000 weight=1 max_fails=2 fail_timeout=30s;
        keepalive 32;
    }

    log_format main '$remote_addr - [$time_local] "$request" '
                    '$status $body_bytes_sent '
                    'upstream: $upstream_addr '
                    'response_time: $upstream_response_time';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    server {
        listen 80;
        server_name _;

        # Timeouts for long requests
        proxy_connect_timeout 60s;
        proxy_send_timeout 2500s;
        proxy_read_timeout 2500s;

        # Buffer settings
        proxy_buffering off;
        client_max_body_size 100m;

        # Health check
        location = /health {
            proxy_pass http://claude_wrapper/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Status
        location = /lb-status {
            default_type application/json;
            return 200 '{"load_balancer": "nginx", "backends": {"wrapper": "eco-wrapper:8000"}, "bedrock_routing": "handled_by_fastapi", "status": "healthy"}';
        }

        # All requests go to wrapper (FastAPI handles Bedrock routing internally)
        location / {
            proxy_pass http://claude_wrapper;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Streaming support
            chunked_transfer_encoding on;
        }
    }
}
