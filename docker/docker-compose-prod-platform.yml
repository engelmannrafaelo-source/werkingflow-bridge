# =============================================================================
# Bridge Platform-Layer — Additive Overlay für docker-compose-prod.yml
#
# Adds Postgres for Identity/Tenants/Budget/Billing/Activity.
# Worker-Services in docker-compose-prod.yml bleiben unverändert; ihre Env wird
# über die separate platform.env-Datei erweitert (siehe deploy notes).
#
# Usage:
#   docker compose -f docker-compose-prod.yml -f docker-compose-prod-platform.yml up -d postgres-prod
#
# Postgres läuft im gleichen Network (bridge-prod-net) wie die Worker, damit
# der Bridge-Hostname "postgres-prod:5432" funktioniert.
# =============================================================================

services:
  # Prod-Worker bekommen platform.env (BRIDGE_DB_URL) — damit der /v1/jobs durable
  # store + der Budget-Gate/Activity-Pool laufen. Spiegelt das dev-Overlay
  # (worker1-4 env_file). Das Flag BRIDGE_GENERIC_JOBS_ENABLED steht in der base
  # docker-compose-prod.yml (wie auf dev).
  worker-sahori:
    env_file:
      - ../secrets/platform.env
  worker-kurt:
    env_file:
      - ../secrets/platform.env

  postgres-prod:
    image: postgres:16-alpine
    container_name: bridge-postgres-prod
    # Host-Port absichtlich NICHT exposed (5432:5432) — Postgres ist nur
    # innerhalb des bridge-prod-net erreichbar. Reduziert Attack Surface.
    expose:
      - "5432"
    environment:
      - POSTGRES_USER=bridge
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_password
      - POSTGRES_DB=bridge
    volumes:
      - bridge-postgres-prod-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridge -d bridge"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    networks:
      - bridge-prod-net
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M

  # =============================================================================
  # platform-api — Dedicated DB-backed platform layer (Prod / Server-2).
  # Mirror of the dev overlay's platform-api, with prod container name + the
  # single prod network (bridge-prod-net = docker_bridge-prod-net). Serves all
  # DB-backed routes (/v1/auth|users|tenants|billing|budget|activity|audit|
  # feedback|dev-tokens|stammdaten|invoices|system|impersonation|app-licenses|
  # admin, /v1/db/health, /v1/sandbox/*). fail-loud ohne BRIDGE_DB_URL.
  # =============================================================================
  platform-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.platform
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: wt-prod-platform-api
    expose:
      - "8000"
    # Sandbox lease (/v1/sandbox/lease-token) liest OAuth-Token aus
    # BRIDGE_SECRETS_DIR/claude_token_<account>.txt — gleiche Konvention wie Worker.
    volumes:
      - /root/werkingflow-bridge/secrets:/app/secrets:ro
    env_file:
      - ../secrets/platform.env
    environment:
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - LOG_TO_FILE=false
      - FILTER_SENSITIVE_DATA=true
      - CORS_ORIGINS=["*"]
      - BRIDGE_SECRETS_DIR=/app/secrets
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - bridge-prod-net
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # ===========================================================================
  # TLS-Terminator (Mollie-Webhook) — prod-bridge.werking.tools
  # Mollie ruft Webhooks NUR über HTTPS; BRIDGE_PUBLIC_URL zeigt auf
  # https://prod-bridge.werking.tools (Live-Key!), aber der Host hatte nie
  # einen 443-Listener → Kundenzahlungen würden nie gutgeschrieben (Befund
  # 02.08.2026 auf der Dev-Bridge, Prod identisch gebaut). Caddy terminiert
  # TLS (Zertifikate automatisch via Let's Encrypt, Retry bis der DNS-A-Record
  # existiert) und reicht 1:1 an den OpenResty-LB weiter — additiv, keinerlei
  # Änderung an dessen Routing-/Failover-Logik.
  # ===========================================================================
  caddy-tls:
    image: caddy:2.8
    container_name: wt-prod-caddy-tls
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.server2:/etc/caddy/Caddyfile:ro
      - caddy-tls-data:/data
      - caddy-tls-config:/config
    networks:
      - bridge-prod-net
    depends_on:
      - nginx

volumes:
  bridge-postgres-prod-data:
    driver: local
  caddy-tls-data:
    driver: local
  caddy-tls-config:
    driver: local

secrets:
  postgres_password:
    file: ../secrets/postgres_password.txt
