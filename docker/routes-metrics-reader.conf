# =============================================================================
# CANONICAL metrics-reader route set — SINGLE SOURCE (ADR-0006 item A)
# =============================================================================
# Included by docker/nginx.conf — since ADR-0006 B/C the ONE OpenResty config
# for BOTH bridges (docker/nginx-prod.conf existiert nicht mehr).
# Mounted into each nginx container at /etc/nginx/routes-metrics-reader.conf.
#
# WHY THIS FILE EXISTS: the metrics-reader endpoint allowlist used to be
# hand-duplicated in both configs (primary as prefix locations, prod as one
# regex). On 2026-06/07 prod's copy omitted `account-pool-state` +
# `sandbox-observed-rate-limit`, so those paths fell through to a worker
# (flat single-worker schema) instead of the metrics-reader aggregator
# ({"accounts":{...}}). Every werking-energy Phase-4 pre-flight then read
# "ZERO Anthropic accounts" and killed the pipeline. Sharing this single file
# makes that class of drift structurally impossible — add an endpoint HERE and
# both bridges get it.
#
# CONTRACT: the including server{} MUST provide `set $metrics_reader
# "http://<host>:8000";` plus a `resolver` in scope (same pattern and reasoning
# as routes-platform-api.conf: variable proxy_pass re-resolves the DNS name per
# request and survives a metrics-reader recreate; a static upstream froze the
# IP at nginx startup — 502 after the first recreate, seen 2026-08-31).
# The route set is identical by construction; only the target differs.
#
# NOTE: `usage` + `timeseries` are deliberately NOT here — they route to
# platform-api (DB-backed, no JSONL). This regex has no trailing `$`, so it is
# prefix-equivalent, and since none of these literals match `usage`/`timeseries`
# alone, those paths correctly fall through to their own locations.
# =============================================================================
# The reader LIVES NEXT TO THE WORKERS' FILES (since the ADR-0009 cutover
# 2026-08-31 that means the worker-host on prod — $metrics_reader is the
# per-topology target, see nginx.conf). Every file-based endpoint here
# (request-log, prompt-performance*, cc-usage-history, contract, …) reads
# JSONL the workers write into the shared logs volume; served from a host
# without the workers, they all freeze at the moment the workers leave —
# that is how the CUI account badges died on cutover day. If the reader and
# the workers ever separate again, this whole list goes stale, not one route.
location ~ ^/v1/metrics/(prompt-performance|throughput|usage-breakdown|request-log|cc-usage-history|contract|limiter-trajectory|upstream-health|account-pool-state|sandbox-observed-rate-limit) {
    proxy_pass $metrics_reader;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
