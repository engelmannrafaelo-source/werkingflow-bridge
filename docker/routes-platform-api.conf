# =============================================================================
# CANONICAL platform-api route set — SINGLE SOURCE (ADR-0006 item A)
# =============================================================================
# Included by BOTH docker/nginx.conf (primary/dev, OpenResty+Lua) and
# docker/nginx-prod.conf (production, nginx:alpine) inside their server{} block.
# Mounted into each nginx container at /etc/nginx/routes-platform-api.conf.
#
# WHY THIS FILE EXISTS: the platform-api endpoint set (identity/billing/budget/
# activity/admin + sandbox + db-backed metrics usage/timeseries + db/health) was
# hand-duplicated in both configs. The route *paths* were identical, but the two
# copies drifted on mechanism and hardening (primary used a static `upstream`
# block, prod used variable proxy_pass; prod set proxy_next_upstream off + a 5s
# connect timeout, primary did not). Sharing this ONE file makes the route set
# and its fail-loud posture identical by construction.
#
# CONTRACT — the including server{} MUST provide two things:
#   1. `set $platform_api "http://<host>:8000";`  ← the per-env TARGET. This is
#      the ONLY legitimate difference and stays a per-config parameter (both are
#      currently "http://platform-api:8000"; kept a variable so a future prod
#      overlay can repoint without touching the shared routes).
#   2. a `resolver` in scope (http or server) — required so variable proxy_pass
#      re-resolves the platform-api DNS name per `valid=`.
#
# WHY VARIABLE proxy_pass (not a static `upstream` block): a static upstream
# resolves the platform-api container IP ONCE at nginx startup. After a
# platform-api container restart the IP changes and nginx keeps hitting the
# stale IP → 502 until a manual `nginx -s reload`. Variable proxy_pass +
# resolver re-resolves per `valid=`, surviving restarts. prod already did this;
# primary used a static upstream (a latent stale-IP 502 bug) — this include puts
# BOTH bridges on the resilient mechanism.
#
# proxy_next_upstream off: these are DB read/write calls, not LLM calls. On
# platform-api down the client gets 502 (fail loud) — no silent retry/fallback.
#
# ORDERING: this file MUST be included AFTER routes-metrics-reader.conf. nginx
# matches regex locations in appearance order; the metrics-reader regex must win
# for /v1/metrics/usage-breakdown etc. before the usage|timeseries regex below.
# =============================================================================

# Platform-API DB-backed metrics — usage aggregates + timeseries +
# bedrock-reconciliation + pricing-SSoT-export (NOT JSONL, so NOT served by
# metrics-reader). Disjoint from the metrics-reader alternation.
location ~ ^/v1/metrics/(usage|timeseries|bedrock-reconciliation|pricing) {
    proxy_pass $platform_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_next_upstream off;
}

# /v1/auth/status ist eine WORKER-Route (main.py: Claude-Auth + Backend-
# Verfügbarkeit), KEINE platform-api-Route — der auth|…-Regex darunter würde
# sie zur platform-api schatten (dort 404; BridgeMonitor-Tabs pollten ins
# Leere). Exact-match gewinnt vor Regex und pinnt sie zurück auf den Pool.
location = /v1/auth/status {
    proxy_pass http://$backend_pool;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_next_upstream off;
}

# Identity / billing / budget / activity / audit / admin / app-licenses — all
# DB-backed. JWT and service-token headers pass through unchanged.
location ~ ^/v1/(auth|users|tenants|billing|budget|activity|audit|feedback|developer-tokens|stammdaten|invoices|system|impersonation|app-licenses|admin|platform-config)(/|$) {
    proxy_pass $platform_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_next_upstream off;
}

# DB health probe — short timeout, fail loud.
location = /v1/db/health {
    proxy_pass $platform_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 10s;
    proxy_connect_timeout 5s;
    proxy_next_upstream off;
}

# All sandbox routes live on platform-api: lease-token + usage
# (src/sandbox/routes.py) and conversations (conversation_routes.py).
location ~ ^/v1/sandbox {
    proxy_pass $platform_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    proxy_connect_timeout 5s;
    proxy_next_upstream off;
}
