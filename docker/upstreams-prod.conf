# AUTO-GENERATED by scripts/generate-bridge-upstreams.sh production — DO NOT EDIT
# =============================================================================
# The per-topology worker set for the SHARED docker/nginx.conf (ADR-0006 B/C).
# This is the ONLY nginx difference between the two bridges. ${BRIDGE_BACKUP_HOST}
# is resolved by the compose envsubst before nginx loads this file.
#   topology : production
#   workers  : worker-sahori worker-kurt worker-coach worker-erk
# Regenerate with the generator; never hand-edit. bridge-parity-check.sh verifies
# the in-container copy matches this repo file.
# =============================================================================

# Round-robin default pool (used by /health, Lua-routed /v1 SSE, default /).
upstream claude_workers {
    server 100.93.143.105:8001 weight=1 max_fails=0;
    server 100.93.143.105:8002 weight=1 max_fails=0;
    server 100.93.143.105:8003 weight=1 max_fails=0;
    server 100.93.143.105:8004 weight=1 max_fails=0;
    server ${BRIDGE_BACKUP_HOST}:8000 backup max_fails=1 fail_timeout=10s;
    keepalive 32;
}

# Production-priority pool (X-Priority: production).
# Local prod workers first, ${BRIDGE_BACKUP_HOST} (the dev bridge) is the
# overflow path — already the wanted order, unchanged.
upstream claude_production {
    server 100.93.143.105:8001 weight=1 max_fails=0;
    server 100.93.143.105:8002 weight=1 max_fails=0;
    server 100.93.143.105:8003 weight=1 max_fails=0;
    server 100.93.143.105:8004 weight=1 max_fails=0;
    server ${BRIDGE_BACKUP_HOST}:8000 backup max_fails=1 fail_timeout=10s;
    keepalive 16;
}

# LLM-pool selection for the account-consuming paths (chat/research +
# POST /v1/jobs) — consumed by the shared nginx.conf (ADR-0010).
# $bridge_hopped (nginx.conf) is 1 when the request already crossed a
# bridge once (X-Bridge-Hop); hopped traffic is ALWAYS served from the
# local tier — that is the one-hop loop guard.
# production: local workers ARE Level 1 — only the explicit
# X-Priority pool split remains, hopped traffic stays local.
map "$bridge_hopped:$http_x_priority" $llm_backend_pool {
    "0:production"  claude_production;
    default         claude_workers;
}

# Job-poll routing by home-bridge marker (ADR-0012).
# Job polls whose marker names THIS bridge: local workers only.
# Deliberately NOT claude_workers — that pool carries the cross-bridge
# backup on production, and a poll that failed over to the peer would
# ask the wrong store again, i.e. re-create the bug from the other side.
upstream claude_jobs_home {
    server 100.93.143.105:8001 weight=1 max_fails=0;
    server 100.93.143.105:8002 weight=1 max_fails=0;
    server 100.93.143.105:8003 weight=1 max_fails=0;
    server 100.93.143.105:8004 weight=1 max_fails=0;
    keepalive 16;
}

# Job polls whose marker names the PEER bridge: forward there, once.
upstream claude_jobs_peer {
    server ${BRIDGE_BACKUP_HOST}:8000 weight=1 max_fails=1 fail_timeout=10s;
    keepalive 8;
}

# Poll routing. $job_home_marker (docker/nginx.conf) is the marker parsed out
# of the request URI, "" when the id carries none.
#
#   default            -> $llm_backend_pool = EXACTLY today's behaviour. This is
#                         the transition rule and the reason the LB half can be
#                         deployed in either order relative to the app half:
#                         unmarked ids (minted before the app rollout) keep
#                         routing as they always did instead of being rejected,
#                         which would kill every job in flight at cutover. It
#                         also covers a marker naming neither bridge — nginx
#                         must not invent a destination; the worker answers and
#                         fails loud with 421 (jobs/routes.py).
#   hopped:<peer>      -> home, NOT peer: a poll that already crossed once must
#                         never be forwarded again (the ADR-0010 one-hop loop
#                         guard). The local worker then answers 421 — loud, and
#                         provably terminating.
#
# The own-side keys use ${BRIDGE_ID} verbatim, so they cannot drift from the
# id the workers stamp. If this include were ever mounted on a host whose
# BRIDGE_ID equals the peer marker below, the two keys would collide and nginx
# would refuse to start — a wrong pairing fails at load, not in production.
map "$bridge_hopped:$job_home_marker" $job_poll_pool {
    default              $llm_backend_pool;
    "0:${BRIDGE_ID}"     claude_jobs_home;
    "1:${BRIDGE_ID}"     claude_jobs_home;
    "0:dev"           claude_jobs_peer;
    "1:dev"           claude_jobs_home;
}
