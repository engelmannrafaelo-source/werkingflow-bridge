events {
    worker_connections 1024;
}

http {
    # ==========================================================================
    # Docker embedded DNS — required for both:
    # 1. resty.http in pool_router.lua to resolve "metrics-reader"
    # 2. balancer.set_current_peer("workerN", 8000) to resolve worker names
    # ==========================================================================
    resolver 127.0.0.11 ipv6=off valid=30s;

    # ==========================================================================
    # Lua pool-router (Phase C — LIVE)
    # Requires OpenResty image (see docker/Dockerfile.nginx-lb).
    # Routing in upstream claude_workers via balancer_by_lua_block below.
    # ==========================================================================
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict pool_state 1m;
    init_worker_by_lua_block {
        require("pool_router").init()
    }

    # ==========================================================================
    # Upstream: Round-Robin Default Pool (used by /health, /lb-status, default /)
    # ==========================================================================
    upstream claude_workers {
        server worker1:8000 weight=1 max_fails=0;
        server worker2:8000 weight=1 max_fails=0;
        server worker3:8000 weight=1 max_fails=0;
        server worker4:8000 weight=1 max_fails=0;
        keepalive 32;
    }

    # ==========================================================================
    # Per-worker upstreams — used for Lua-driven pool routing (Phase C)
    # access_by_lua_block sets $target_pool, proxy_pass http://$target_pool
    # ==========================================================================
    upstream claude_w1 { server worker1:8000 max_fails=0; keepalive 8; }
    upstream claude_w2 { server worker2:8000 max_fails=0; keepalive 8; }
    upstream claude_w3 { server worker3:8000 max_fails=0; keepalive 8; }
    upstream claude_w4 { server worker4:8000 max_fails=0; keepalive 8; }
    upstream claude_unavail { server 0.0.0.1:1; }  # triggers @bridge_full when all accounts exhausted

    map $target_worker $target_pool {
        default        claude_w1;
        "worker1"      claude_w1;
        "worker2"      claude_w2;
        "worker3"      claude_w3;
        "worker4"      claude_w4;
        "unavailable"  claude_unavail;
    }

    # ==========================================================================
    # Upstream: Metrics Reader — persistent file-based metrics (always available)
    # Even when all workers are down, the reader serves historical data from JSONL.
    # ==========================================================================
    upstream metrics_reader {
        server metrics-reader:8000;
        keepalive 4;
    }

    # ==========================================================================
    # Upstream: Production — Server 2 primaer, lokale Worker als Fallback
    # BRIDGE_PROD_HOST = IP des Production Reserve Servers (env var via envsubst)
    # ==========================================================================
    upstream claude_production {
        # Dev-Server Worker — primaer (alle normalen Production-Requests)
        # 4 Worker Round-Robin, gleiche Logik wie claude_workers
        server worker1:8000 weight=1 max_fails=0;
        server worker2:8000 weight=1 max_fails=0;
        server worker3:8000 weight=1 max_fails=0;
        server worker4:8000 weight=1 max_fails=0;

        # Fallback: Production Reserve Server (Server 2) — NUR wenn alle Dev-Worker down
        server ${BRIDGE_PROD_HOST}:8000 backup max_fails=1 fail_timeout=10s;

        keepalive 16;
    }

    # ==========================================================================
    # Routing: X-Priority Header bestimmt den Pool
    # production → Server 2 (mit lokalem Fallback)
    # alles andere → lokaler Normal Pool
    # ==========================================================================
    map $http_x_priority $backend_pool {
        "production"    claude_production;
        default         claude_workers;
    }

    # ==========================================================================
    # Logging
    # ==========================================================================
    # Human-readable (kept for backwards compat / tail -f)
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                           '$status $body_bytes_sent '
                           '"$http_user_agent" '
                           'upstream: $upstream_addr '
                           'response_time: $upstream_response_time '
                           'pool: $backend_pool';

    # JSONL — one object per line, consumed by CUI Error-Panel.
    # Escape JSON characters in dynamic values via escape=json.
    # "bridge" field identifies which server instance wrote this entry
    # (BRIDGE_ID env var: "dev" on primary, "prod" on production-reserve).
    log_format upstream_jsonl escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"ts_epoch":$msec,'
          '"remote":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"req_time":$request_time,'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_status":"$upstream_status",'
          '"upstream_resp_time":"$upstream_response_time",'
          '"upstream_conn_time":"$upstream_connect_time",'
          '"pool":"$backend_pool",'
          '"priority":"$http_x_priority",'
          '"bridge":"${BRIDGE_ID}",'
          '"user_agent":"$http_user_agent",'
          '"app_id":"$http_x_app_id",'
          '"user_id":"$http_x_user_id",'
          '"workflow_id":"$http_x_workflow_id",'
          '"job_id":"$http_x_job_id",'
          '"agent_id":"$http_x_agent_id",'
          '"pool_decision":"$sent_http_x_pool_decision",'
          '"target_worker":"$sent_http_x_target_worker"'
        '}';

    # stdout (Docker logs) + persistent JSONL on host-mounted volume
    access_log /dev/stdout upstream_log;
    access_log /var/log/nginx/access.jsonl upstream_jsonl;
    error_log /var/log/nginx/error.log warn;

    # ==========================================================================
    # Server Configuration
    # ==========================================================================
    server {
        listen 80;
        server_name _;

        # Timeouts fuer lange Research-Requests (40+ Minuten)
        proxy_connect_timeout 60s;
        proxy_send_timeout 2500s;
        proxy_read_timeout 2500s;
        send_timeout 2500s;

        # Buffer settings fuer grosse Responses
        proxy_buffering off;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        # =======================================================================
        # KRITISCH: Automatic Failover bei Worker-Fehlern
        # http_429 is included so rate-limit penalties (bridge_account_rate_limited)
        # route to the next worker. After all workers exhausted, the final 429
        # is the correct client-facing answer (see @bridge_full for 5xx).
        # =======================================================================
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504 http_429;
        proxy_next_upstream_timeout 120s;
        # 0 = unlimited — scales automatically with any number of workers
        proxy_next_upstream_tries 0;

        # =======================================================================
        # BRIDGE CAPACITY CONTRACT (Phase 2 of robust-bridge initiative)
        # =======================================================================
        # Client-facing contract: the bridge returns EITHER 2xx OR 429 — never
        # 5xx. Workers may still emit 500/503 internally (nginx uses these as
        # failover triggers above). After proxy_next_upstream exhausts all
        # workers, the final upstream 5xx is intercepted here and rewritten
        # into a unified 429 "bridge capacity full" envelope. This makes
        # "bridge full" the only user-visible failure mode — everything else
        # is a contract violation that must be investigated in the panel.
        proxy_intercept_errors on;
        # Inside proxied locations, 5xx falls through to @bridge_full.
        # Named location (below) emits the canonical envelope.

        # =======================================================================
        # Health Check — Normal Pool
        # =======================================================================
        location = /health {
            proxy_pass http://claude_workers/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =======================================================================
        # Health Check — Production Reserve (Server 2)
        # =======================================================================
        location = /health/production {
            proxy_pass http://${BRIDGE_PROD_HOST}:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =======================================================================
        # Metrics Reader — persistent file-based endpoints (worker-independent)
        # These endpoints read from JSONL on disk and work even when all workers
        # are down. The CUI Bridge Monitor depends on these for historical data.
        # =======================================================================
        location /v1/metrics/prompt-performance {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /v1/metrics/throughput {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /v1/metrics/usage-breakdown {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /v1/metrics/request-log {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /v1/metrics/cc-usage-history {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /v1/metrics/contract {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /v1/metrics/limiter-trajectory {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /v1/metrics/account-pool-state {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /v1/metrics/upstream-health {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # lb-status from metrics-reader (real worker health aggregate)
        location = /lb-status {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # =======================================================================
        # Direct Worker Access — License Health Checks + Debugging
        # =======================================================================
        location /worker1/ {
            rewrite ^/worker1/(.*)$ /$1 break;
            proxy_pass http://worker1:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /worker2/ {
            rewrite ^/worker2/(.*)$ /$1 break;
            proxy_pass http://worker2:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /worker3/ {
            rewrite ^/worker3/(.*)$ /$1 break;
            proxy_pass http://worker3:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        location /worker4/ {
            rewrite ^/worker4/(.*)$ /$1 break;
            proxy_pass http://worker4:8000;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # =======================================================================
        # Internal Pool-Router State — observability endpoint (Docker-net only)
        # Exposes: ts, state_age_s, last_refresh_status, last_refresh_err,
        #          decision_counter_per_worker, last_state_snapshot
        # Access from host: docker exec eco-wrapper-lb curl -sf http://127.0.0.1/internal/pool-router/state
        # =======================================================================
        location = /internal/pool-router/state {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;

            default_type application/json;
            content_by_lua_block {
                require("pool_router").state_handler()
            }
        }

        # =======================================================================
        # SSE/Streaming Endpoints — Pool-split routing
        #
        # nginx does not allow proxy_next_upstream inside if{} blocks, so we
        # use the error_page 418 = @named_location trick to split the two pools
        # into separate processing contexts with different retry settings.
        #
        # Production (X-Priority: production):
        #   → @production_streaming — cross-worker retry + Server-2 backup
        #   Server-2 (backup in claude_production) is ONLY reachable via
        #   proxy_next_upstream because max_fails=0 on primaries means nginx
        #   never auto-marks them "down"; retry is the failover mechanism.
        #
        # Default (everything else):
        #   → inline, 1 retry ONLY on upstream 429 (real Anthropic rate-limit).
        #   Note: per-worker upstreams each have 1 server; retry has no effect
        #   today but preserves intent if upstreams are ever multi-server.
        #   pool_exhausted (target_worker="unavailable") and 5xx still go to
        #   @bridge_full via error_page without retry.
        # =======================================================================
        location ~ ^/v1/(chat/completions|research) {
            # Pool split: production → named location (preserves retry + Server-2)
            error_page 418 = @production_streaming;
            if ($http_x_priority = "production") {
                return 418;
            }

            # Phase C — Lua picks worker based on account headroom
            set $target_worker   "worker1";  # safe default
            set $x_pool_decision "";         # populated by pool_router.choose()
            access_by_lua_block {
                require("pool_router").choose()
            }

            # === Default Pool (claude_workers via Lua): retry only on upstream 429 ===
            proxy_pass http://$target_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Backend-Pool    $backend_pool always;
            add_header X-Bridge-Server   "primary" always;
            add_header X-Target-Worker   $target_worker always;
            add_header X-Pool-Decision   $x_pool_decision always;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 2500s;
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
            proxy_next_upstream http_429;
            proxy_next_upstream_tries 2;
            proxy_next_upstream_timeout 30s;

            # @bridge_full differentiates the error type from $upstream_status:
            #   - target_worker=="unavailable" (Lua all_unavail) → 429 pool_exhausted
            #   - upstream 429 (real Anthropic rate-limit)        → 429 rate_limited
            #   - upstream 503                                    → 503 worker_unavailable
            #   - upstream 500 (SDK crash)                        → 502 worker_crash
            #   - upstream 502 / TCP failure                      → 502 worker_unreachable
            proxy_intercept_errors on;
            error_page 429 = @bridge_full;
            error_page 500 502 503 504 = @bridge_full;
        }

        # Production pool handler — cross-worker retry + Server-2 backup preserved.
        # Internal only: triggered via error_page 418 from SSE location above.
        location @production_streaming {
            proxy_pass http://claude_production;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Backend-Pool claude_production always;
            add_header X-Bridge-Server "primary" always;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 2500s;
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504 http_429 non_idempotent;
            proxy_next_upstream_timeout 120s;
            proxy_next_upstream_tries 0;
            error_page 500 502 503 504 = @bridge_full;
        }

        # =======================================================================
        # Default — Pool-basiertes Routing
        # =======================================================================
        location / {
            proxy_pass http://$backend_pool;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Backend-Pool $backend_pool always;
            add_header X-Bridge-Server "primary" always;

            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;

            # Capacity contract — see comment in chat/research location.
            error_page 500 502 503 504 = @bridge_full;
        }

        # =======================================================================
        # @bridge_full — Differentiated error envelope (Autobahn-Prinzip)
        # =======================================================================
        # Triggered by error_page directives in proxied locations.
        # Returns the CORRECT HTTP status per upstream error type — not always 429.
        #
        # Decision matrix:
        #   target_worker == "unavailable"  → 429  pool_exhausted        (Lua: no eligible account)
        #   X-Priority: production          → 429  all_workers_exhausted (production pool after retries)
        #   upstream 429                    → 429  rate_limited          (real Anthropic rate-limit)
        #   upstream 503                    → 503  worker_unavailable    (service unavailable)
        #   upstream 500                    → 502  worker_crash          (SDK exit code 1)
        #   upstream 502 / TCP failure      → 502  worker_unreachable    (gateway error)
        #
        # Envelope keys on `error.reason` for SDK-level branching.
        # X-Upstream-Status header carries the original upstream code for monitors.
        location @bridge_full {
            internal;
            default_type application/json;
            content_by_lua_block {
                local upstream_status_raw = ngx.var.upstream_status or ""
                local upstream_status = tonumber(upstream_status_raw) or 502
                local target_worker   = ngx.var.target_worker or ""
                local x_priority      = ngx.var.http_x_priority or ""

                local http_status, retry_after_s, bridge_type, reason, msg

                if target_worker == "unavailable" then
                    -- Lua pool_router found no eligible account → real pool exhaustion
                    http_status   = 429
                    retry_after_s = 30
                    bridge_type   = "pool_exhausted"
                    reason        = "all_pool_exhausted"
                    msg           = "Bridge capacity full — all workers exhausted. Retry in ~30s."
                elseif x_priority == "production" then
                    -- Production pool: cross-worker retry exhausted all options
                    http_status   = 429
                    retry_after_s = 30
                    bridge_type   = "capacity_full"
                    reason        = "all_workers_exhausted"
                    msg           = "Bridge production pool exhausted after retries. Retry in ~30s."
                elseif upstream_status == 429 then
                    -- Real Anthropic 429 from the chosen worker
                    http_status   = 429
                    retry_after_s = 30
                    bridge_type   = "rate_limited"
                    reason        = "anthropic_rate_limit"
                    msg           = "Anthropic rate limit on selected worker. Retry in ~30s."
                elseif upstream_status == 503 then
                    http_status   = 503
                    retry_after_s = 10
                    bridge_type   = "worker_unavailable"
                    reason        = "upstream_503"
                    msg           = "Upstream worker temporarily unavailable. Retry in ~10s."
                elseif upstream_status == 500 then
                    -- SDK crash (claude_code_sdk exit code 1) — gateway-issue for client
                    http_status   = 502
                    retry_after_s = 5
                    bridge_type   = "worker_crash"
                    reason        = "upstream_500"
                    msg           = "Upstream worker error (SDK crash). Retry in ~5s."
                else
                    -- 502 or TCP-level connection failure
                    http_status   = 502
                    retry_after_s = 5
                    bridge_type   = "worker_unreachable"
                    reason        = "upstream_" .. tostring(upstream_status)
                    msg           = "Upstream worker temporarily unreachable. Retry in ~5s."
                end

                local err_type = (bridge_type == "rate_limited") and "rate_limit_error" or "api_error"

                ngx.status                      = http_status
                ngx.header["Retry-After"]       = tostring(retry_after_s)
                ngx.header["X-Bridge-Capacity"] = bridge_type
                ngx.header["X-Upstream-Status"] = upstream_status_raw
                ngx.header["Content-Type"]      = "application/json"
                ngx.print(string.format(
                    '{"error":{"message":"[Bridge nginx] %s","type":"%s","code":"%d",' ..
                    '"source":"bridge_nginx","bridge_type":"%s","reason":"%s",' ..
                    '"retryable":true,"retry_after_s":%d,"bridge_worker":"nginx-lb",' ..
                    '"upstream_status":%d,"timestamp":0}}',
                    msg, err_type, http_status,
                    bridge_type, reason,
                    retry_after_s, upstream_status
                ))
            }
        }
    }
}
