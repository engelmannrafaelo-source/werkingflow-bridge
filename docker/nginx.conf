# BRIDGE_WORKERS — comma-separated worker upstream names, read by
# docker/lua/pool_router.lua (os.getenv) to size the pool and round-robin
# fallback. The SAME SSoT the metrics-reader uses. Declared here (main context)
# so OpenResty exposes it to Lua. Set per-bridge on the nginx service in compose
# (primary: worker1..4, production: worker-sahori,worker-kurt). ADR-0006 B/C.
env BRIDGE_WORKERS;

events {
    worker_connections 1024;
}

http {
    # ==========================================================================
    # Docker embedded DNS — required for both:
    # 1. resty.http in pool_router.lua to resolve "metrics-reader"
    # 2. balancer.set_current_peer("workerN", 8000) to resolve worker names
    # ==========================================================================
    resolver 127.0.0.11 ipv6=off valid=30s;

    # ==========================================================================
    # Lua pool-router (Phase C — LIVE)
    # Requires OpenResty image (see docker/Dockerfile.nginx-lb).
    # Routing in upstream claude_workers via balancer_by_lua_block below.
    # ==========================================================================
    lua_package_path "/etc/nginx/lua/?.lua;;";
    lua_shared_dict pool_state 1m;
    init_worker_by_lua_block {
        require("pool_router").init()
    }

    # ==========================================================================
    # Per-topology worker set — the ONLY nginx difference between the two bridges.
    # Emitted by scripts/generate-bridge-upstreams.sh into docker/upstreams-*.conf,
    # mounted + envsubst'd (${BRIDGE_BACKUP_HOST}) by the compose into
    # /tmp/upstreams.conf. Provides three blocks:
    #   - upstream claude_workers          (default pool; +backup on prod = Model-B)
    #   - map $target_worker $target_dest  (vestigial; kept for structural parity)
    #   - upstream claude_production       (X-Priority: production; +${BRIDGE_BACKUP_HOST})
    # Everything else in this file is identical for BOTH bridges by construction
    # (ADR-0006 items B/C). Worker names appear NOWHERE else in this file.
    # ==========================================================================
    include /tmp/upstreams.conf;

    # Bogus 0.0.0.1:1 static upstream so a routed-to-"unavailable" request
    # produces a connect-fail. Referenced (as a bare string) by the vestigial
    # $target_dest map inside the include above.
    upstream claude_unavail { server 0.0.0.1:1; }

    # ==========================================================================
    # Upstream: Metrics Reader — persistent file-based metrics (always available)
    # Even when all workers are down, the reader serves historical data from JSONL.
    # `metrics-reader` resolves on BOTH bridges — prod aliases its
    # metrics-reader-prod service to `metrics-reader` (docker-compose-prod.yml) —
    # so this upstream stays shared, not per-topology.
    # ==========================================================================
    upstream metrics_reader {
        server metrics-reader:8000;
        keepalive 4;
    }

    # ==========================================================================
    # Platform API — DB-backed identity/billing/budget/activity/sandbox layer.
    # NO static `upstream` block: the platform-api routes live in the shared
    # docker/routes-platform-api.conf and use variable proxy_pass ($platform_api)
    # + the http-level `resolver` above, so the DNS name re-resolves per request
    # and survives a platform-api container restart (a static upstream would cache
    # the IP at startup and 502 until reload). Target is set at server level
    # (`set $platform_api ...`) so it stays a per-env parameter. See ADR-0006 A.
    # ==========================================================================

    # ==========================================================================
    # Routing: X-Priority Header bestimmt den Pool
    # production → Server 2 (mit lokalem Fallback)
    # alles andere → lokaler Normal Pool
    # ==========================================================================
    map $http_x_priority $backend_pool {
        "production"    claude_production;
        default         claude_workers;
    }

    # ==========================================================================
    # Overflow-capable endpoints — ROUTING POLICY for pool_router.choose()
    #
    # "1" declares: this endpoint has an execution path that does NOT consume
    # subscription-pool capacity, so a full pool must NOT terminally reject it.
    # pool_router routes it anyway and marks it X-Pool-Exhausted:1; the app —
    # the only layer that can resolve the path (it needs the caller's provider
    # pin from the DB, and for /v1/jobs the job kind from the body) — then
    # either runs the non-pool path or emits the identical 429.
    #
    #   /v1/research  → research-cloud (Anthropic 1P API, billed separately).
    #                   Its overflow trigger IS pool saturation, so gating it on
    #                   pool capacity makes it unreachable exactly when needed.
    #   /v1/jobs      → per-kind placement veto in src/jobs/routes.py. A research
    #                   job self-POSTs /v1/research and inherits the cloud path;
    #                   only the app knows the kind. Non-research kinds are still
    #                   rejected — one worker hop later, by the app's veto.
    #
    # Everything else (notably /v1/chat/completions) gets the hard reject: no
    # alternative path exists there, so failing fast at nginx is correct.
    # Adding an endpoint here WITHOUT an app-side admission check would remove
    # its capacity protection — the app-side reject is the other half of this.
    # ==========================================================================
    map $uri $pool_overflow_capable {
        default          0;
        /v1/research     1;
        /v1/jobs         1;
    }

    # ==========================================================================
    # Logging
    # ==========================================================================
    # Human-readable (kept for backwards compat / tail -f)
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                           '$status $body_bytes_sent '
                           '"$http_user_agent" '
                           'upstream: $upstream_addr '
                           'response_time: $upstream_response_time '
                           'pool: $backend_pool';

    # JSONL — one object per line, consumed by CUI Error-Panel.
    # Escape JSON characters in dynamic values via escape=json.
    # "bridge" field identifies which server instance wrote this entry
    # (BRIDGE_ID env var: "dev" on primary, "prod" on production-reserve).
    log_format upstream_jsonl escape=json
        '{'
          '"ts":"$time_iso8601",'
          '"ts_epoch":$msec,'
          '"remote":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$request_uri",'
          '"status":$status,'
          '"bytes":$body_bytes_sent,'
          '"req_time":$request_time,'
          '"upstream_addr":"$upstream_addr",'
          '"upstream_status":"$upstream_status",'
          '"upstream_resp_time":"$upstream_response_time",'
          '"upstream_conn_time":"$upstream_connect_time",'
          '"pool":"$backend_pool",'
          '"priority":"$http_x_priority",'
          '"bridge":"${BRIDGE_ID}",'
          '"user_agent":"$http_user_agent",'
          '"app_id":"$http_x_app_id",'
          '"user_id":"$http_x_user_id",'
          '"workflow_id":"$http_x_workflow_id",'
          '"job_id":"$http_x_job_id",'
          '"agent_id":"$http_x_agent_id",'
          '"pool_decision":"$sent_http_x_pool_decision",'
          '"target_worker":"$sent_http_x_target_worker"'
        '}';

    # stdout (Docker logs) + persistent JSONL on host-mounted volume
    access_log /dev/stdout upstream_log;
    access_log /var/log/nginx/access.jsonl upstream_jsonl;
    error_log /var/log/nginx/error.log warn;

    # ==========================================================================
    # Server Configuration
    # ==========================================================================
    server {
        listen 80;
        server_name _;

        # ==========================================================================
        # Body-Size Limit — PDF/document upload (file conversion endpoints)
        # Default 1m was rejecting >1MB PDFs with HTTP 413 at the proxy layer.
        # App caps raw PDF at 50MB; bridge gets it base64-in-JSON (~1.33x) => ~67MB.
        # ==========================================================================
        client_max_body_size 75M;


        # Timeouts fuer lange Research-Requests (40+ Minuten)
        proxy_connect_timeout 60s;
        proxy_send_timeout 2500s;
        proxy_read_timeout 2500s;
        send_timeout 2500s;

        # Buffer settings fuer grosse Responses
        proxy_buffering off;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        # =======================================================================
        # KRITISCH: Automatic Failover bei Worker-Fehlern
        # http_429 is included so rate-limit penalties (bridge_account_rate_limited)
        # route to the next worker. After all workers exhausted, the final 429
        # is the correct client-facing answer (see @bridge_full for 5xx).
        # =======================================================================
        proxy_next_upstream error timeout http_500 http_502 http_503 http_504 http_429;
        proxy_next_upstream_timeout 1200s;  # raised from 120s: must exceed 600s worst-case attempt so backup (dev-bridge) is reachable via failover
        # 0 = unlimited — scales automatically with any number of workers
        proxy_next_upstream_tries 0;

        # =======================================================================
        # BRIDGE CAPACITY CONTRACT (Phase 2 of robust-bridge initiative)
        # =======================================================================
        # Client-facing contract: the bridge returns EITHER 2xx OR 429 — never
        # 5xx. Workers may still emit 500/503 internally (nginx uses these as
        # failover triggers above). After proxy_next_upstream exhausts all
        # workers, the final upstream 5xx is intercepted here and rewritten
        # into a unified 429 "bridge capacity full" envelope. This makes
        # "bridge full" the only user-visible failure mode — everything else
        # is a contract violation that must be investigated in the panel.
        proxy_intercept_errors on;
        # Inside proxied locations, 5xx falls through to @bridge_full.
        # Named location (below) emits the canonical envelope.

        # =======================================================================
        # X-Pool-Exhausted is an INFRASTRUCTURE signal, never client input.
        #
        # Only pool_router.choose() may assert it (see the $pool_overflow_capable
        # map); the app trusts it to decide whether a pool-bound request can be
        # served at all. Strip any inbound copy here, once, for every request —
        # `proxy_set_header` cannot carry this guarantee, because a location that
        # declares its own proxy_set_header set discards the inherited one, and
        # only two of this file's proxying locations re-add it. Clearing the
        # INPUT header is the single choke point that holds for all of them.
        #
        # (Forging it is self-harm rather than escalation — it can only make the
        # Bridge refuse your own request — but an infrastructure signal a caller
        # can set is a contract hole, not a judgement call.)
        # =======================================================================
        more_clear_input_headers "X-Pool-Exhausted";

        # =======================================================================
        # Health Check — Normal Pool
        # =======================================================================
        location = /health {
            proxy_pass http://claude_workers/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =======================================================================
        # Health Check — the backup bridge (${BRIDGE_BACKUP_HOST}).
        # On primary that is Server-2 (production reserve); on production that is
        # the dev bridge (Model-B fallback). Same env var, per-bridge value.
        # =======================================================================
        location = /health/production {
            proxy_pass http://${BRIDGE_BACKUP_HOST}:8000/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # =======================================================================
        # Metrics Reader — persistent file-based endpoints (worker-independent)
        # These endpoints read from JSONL on disk and work even when all workers
        # are down. The CUI Bridge Monitor depends on these for historical data.
        #
        # SINGLE SOURCE (ADR-0006 item A): the endpoint allowlist lives in the
        # shared docker/routes-metrics-reader.conf, included by BOTH this file and
        # docker/nginx-prod.conf. Edit that ONE file to change both bridges — they
        # can no longer drift (the omission that caused the werking-energy Phase-4
        # "ZERO Anthropic accounts" incident is now structurally impossible).
        # Requires `upstream metrics_reader` (defined above) + the file mounted at
        # /etc/nginx/routes-metrics-reader.conf (see docker-compose*.yml).
        # =======================================================================
        include /etc/nginx/routes-metrics-reader.conf;

        # =======================================================================
        # Platform API routes — SINGLE SOURCE (ADR-0006 item A).
        # The route set (metrics usage/timeseries, auth/billing/…/admin, db/health,
        # sandbox) lives in the shared docker/routes-platform-api.conf, included by
        # BOTH this file and docker/nginx-prod.conf. MUST come AFTER the
        # metrics-reader include (regex first-match: usage-breakdown → reader).
        # $platform_api is the per-env target (the only legit difference); the
        # http-level `resolver` above makes variable proxy_pass re-resolve DNS.
        # =======================================================================
        set $platform_api "http://platform-api:8000";
        include /etc/nginx/routes-platform-api.conf;

        # lb-status from metrics-reader (real worker health aggregate)
        location = /lb-status {
            proxy_pass http://metrics_reader;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # =======================================================================
        # Direct Worker Access — License Health Checks + Debugging
        # Topology-agnostic: one regex captures ANY worker upstream name
        # (worker1..4 on primary, worker-sahori/worker-kurt on prod) and proxies
        # to it via variable proxy_pass (+ the http-level `resolver`). No
        # per-worker block, so this stays identical on both bridges. No other
        # route starts with "/worker", so there is no shadowing.
        # =======================================================================
        location ~ ^/(worker[a-zA-Z0-9_-]+)/(.*)$ {
            set $direct_worker $1;
            proxy_pass http://$direct_worker:8000/$2$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }

        # =======================================================================
        # Internal Pool-Router State — observability endpoint (Docker-net only)
        # Exposes: ts, state_age_s, last_refresh_status, last_refresh_err,
        #          decision_counter_per_worker, last_state_snapshot
        # Access from host: docker exec wt-wrapper-lb curl -sf http://127.0.0.1/internal/pool-router/state
        # =======================================================================
        location = /internal/pool-router/state {
            allow 127.0.0.1;
            allow 172.16.0.0/12;
            deny all;

            default_type application/json;
            content_by_lua_block {
                require("pool_router").state_handler()
            }
        }

        # Platform-API routes (auth/billing/…/admin, db/health, sandbox) are now
        # single-sourced via the shared include above (routes-platform-api.conf).

        # =======================================================================
        # SSE/Streaming Endpoints — Pool-split routing
        #
        # nginx does not allow proxy_next_upstream inside if{} blocks, so we
        # use the error_page 418 = @named_location trick to split the two pools
        # into separate processing contexts with different retry settings.
        #
        # Production (X-Priority: production):
        #   → @production_streaming — cross-worker retry + Server-2 backup
        #   Server-2 (backup in claude_production) is ONLY reachable via
        #   proxy_next_upstream because max_fails=0 on primaries means nginx
        #   never auto-marks them "down"; retry is the failover mechanism.
        #
        # Default (everything else):
        #   → inline, 1 retry ONLY on upstream 429 (real Anthropic rate-limit).
        #   Note: per-worker upstreams each have 1 server; retry has no effect
        #   today but preserves intent if upstreams are ever multi-server.
        #   pool_exhausted (target_worker="unavailable") and 5xx still go to
        #   @bridge_full via error_page without retry.
        #
        # Scope — chat/completions|research ONLY, deliberately NOT the
        # privacy/document-conversion endpoints (convert-html-to-docx,
        # convert-pdf-to-html-direct, document/convert, privacy/smart-anonymize):
        # those all proxy through to the ONE shared privacy-service container
        # regardless of which bridge worker handles the request (see
        # privacy_client.py — PRIVACY_SERVICE_URL is a single fixed hostname).
        # `proxy_next_upstream ... non_idempotent` below exists so a stalled/
        # errored chat POST can be retried on a DIFFERENT worker, which has a
        # different Anthropic account with fresh capacity — a real win. For the
        # privacy/document routes retrying on a different worker reaches the
        # SAME backend and SAME CPU-bound bottleneck, so a retry after a
        # timeout/connection-error just resubmits the same expensive analysis
        # while that backend is already struggling — amplifying load instead of
        # recovering from it (root-caused 2026-07-22, see
        # observation_bridge_smart_anonymize_large_text_failure_20260722 in the
        # werking-report workspace memory). Those routes intentionally fall
        # through to the default `location /` below, which already has the
        # correct behaviour: no non_idempotent retry, same timeouts.
        # =======================================================================
        location ~ ^/v1/(chat/completions|research) {
            # Pool split: production → named location (preserves retry + Server-2)
            error_page 418 = @production_streaming;
            if ($http_x_priority = "production") {
                return 418;
            }

            # Phase C — Lua picks worker based on account headroom.
            # "pending" is a topology-agnostic pre-Lua sentinel: choose() always
            # overwrites $target_worker; if it somehow did not, "pending" is not
            # "unavailable", so the request still proxies to claude_workers.
            set $target_worker   "pending";
            set $x_pool_decision "";         # populated by pool_router.choose()
            set $pool_exhausted  "";         # "1" when choose() found no eligible account
            access_by_lua_block {
                require("pool_router").choose({
                    overflow_capable = (ngx.var.pool_overflow_capable == "1"),
                })
                -- Reject HERE, in the access phase, not via `if ($target_worker
                -- = "unavailable") return 419`. That if() lives in the REWRITE
                -- phase, which nginx runs BEFORE access_by_lua_block assigns the
                -- variable, so it only ever compared the "pending" sentinel and
                -- never fired: every request reached a worker even with all
                -- accounts exhausted, and the 429 came from @bridge_full only
                -- after hammering all four (proven end-to-end 2026-07-30).
                -- ngx.exec keeps @pool_exhausted_response as the single place
                -- the envelope is written — no second copy to drift.
                if ngx.var.target_worker == "unavailable" then
                    return ngx.exec("@pool_exhausted_response")
                end
            }

            # Tell the app the truth about pool capacity. ALWAYS set, so a
            # client-supplied value can never reach a worker: an empty value
            # makes nginx drop the header entirely.
            proxy_set_header X-Pool-Exhausted $pool_exhausted;

            # === Default Pool: static upstream for cross-worker retry (proxy_next_upstream
            # requires static proxy_pass — variable proxy_pass disables it). Lua still
            # sets $target_worker for observability; the access-phase guard above
            # already handled "unavailable", so the bogus upstream is never reached. ===
            proxy_pass http://claude_workers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Backend-Pool    $backend_pool always;
            add_header X-Bridge-Server   "primary" always;
            add_header X-Target-Worker   $target_worker always;
            add_header X-Pool-Decision   $x_pool_decision always;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 2500s;
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
            # Cross-worker retry: same policy as @production_streaming.
            # After all workers exhausted, final error → @bridge_full → 503 capacity_busy.
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504 http_429 non_idempotent;
            proxy_next_upstream_timeout 1200s;  # raised from 120s: must exceed 600s worst-case attempt so backup (dev-bridge) is reachable via failover
            proxy_next_upstream_tries 0;

            # @bridge_full unifies all 5xx into 503 capacity_busy (Autobahn contract).
            # 429 (real Anthropic rate-limit) remains 429.
            # pool_exhausted (target_worker="unavailable") is handled above by @pool_exhausted_response.
            #   - upstream 429 (real Anthropic rate-limit)        → 429 rate_limited
            #   - upstream 503                                    → 503 worker_unavailable
            #   - upstream 500 (SDK crash)                        → 502 worker_crash
            #   - upstream 502 / TCP failure                      → 502 worker_unreachable
            proxy_intercept_errors on;
            error_page 429 = @bridge_full;
            error_page 500 502 503 504 = @bridge_full;
        }

        # Production pool handler — cross-worker retry + Server-2 backup preserved.
        # Internal only: triggered via error_page 418 from SSE location above.
        location @production_streaming {
            proxy_pass http://claude_production;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Backend-Pool claude_production always;
            add_header X-Bridge-Server "primary" always;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 2500s;
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;
            proxy_next_upstream error timeout http_500 http_502 http_503 http_504 http_429 non_idempotent;
            proxy_next_upstream_timeout 1200s;  # raised from 120s: must exceed 600s worst-case attempt so backup (dev-bridge) is reachable via failover
            proxy_next_upstream_tries 0;
            error_page 500 502 503 504 = @bridge_full;
        }

        # =======================================================================
        # Job submission (POST /v1/jobs) — capacity-routed PLACEMENT.
        #
        # A generic async job EXECUTES in-process on the worker that receives
        # the POST (jobs/routes.py: store.create_job → spawn(run_generic_job)),
        # and the executor's chat self-call deliberately pins to that worker
        # (jobs/executors.py SELF_BASE_URL, localhost) — so the landing worker
        # decides which ACCOUNT does the LLM work. Before this location
        # existed, the POST fell through to `location /` (blind $backend_pool
        # round-robin past the pool router): with 2 of 4 accounts
        # weekly-exhausted, ~half of all submissions landed on workers whose
        # in-process execution could only die with account_exhausted (429
        # wrapped in a job error) — observed 2026-07-29 on the energy
        # harmonize path, which moved to /v1/jobs on 2026-07-28
        # (keepalive/NAT fix) and thereby AROUND the router that
        # /v1/chat/completions always had. choose() closes exactly that hole.
        #
        # Reads stay OUT of the capacity gate: GET /v1/jobs (list) here and
        # GET /v1/jobs/{id} (status polls — different path, still `location /`)
        # are DB-backed (shared ai_jobs table, any worker answers). A poller
        # that got 429'd during full exhaustion would falsely declare a
        # RUNNING job dead.
        #
        # Cross-worker retry ONLY on http_429: a capacity-locked worker
        # rejects the POST synchronously BEFORE creating the job row
        # (jobs/routes.py placement veto → account_exhausted envelope), so a
        # 429-retry on the next worker is provably double-dispatch-free.
        # Deliberately NO error/timeout retry: those can fire AFTER the row
        # was created+dispatched — a retry would double-dispatch the job.
        # choose() stays for the all-unavail fast-429 + observability, exactly
        # like chat/research (the $target_worker pick itself is observability;
        # placement migrates via the 429 retry chain).
        # =======================================================================
        location = /v1/jobs {
            # Reads bypass the gate (DB read, any worker serves it).
            error_page 421 = @jobs_read;
            if ($request_method != POST) {
                return 421;
            }

            # Production priority keeps its dedicated pool, like chat above.
            error_page 418 = @production_jobs;
            if ($http_x_priority = "production") {
                return 418;
            }

            set $target_worker   "pending";
            set $x_pool_decision "";         # populated by pool_router.choose()
            set $pool_exhausted  "";         # "1" when choose() found no eligible account
            access_by_lua_block {
                require("pool_router").choose({
                    overflow_capable = (ngx.var.pool_overflow_capable == "1"),
                })
                -- Access-phase reject: see the chat/research location for why
                -- the rewrite-phase if($target_worker = "unavailable") could
                -- never fire.
                if ngx.var.target_worker == "unavailable" then
                    return ngx.exec("@pool_exhausted_response")
                end
            }

            # See the chat/research location: always set, so a client-supplied
            # value can never reach a worker.
            proxy_set_header X-Pool-Exhausted $pool_exhausted;

            proxy_pass http://claude_workers;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Bridge-Server   "primary" always;
            add_header X-Target-Worker   $target_worker always;
            add_header X-Pool-Decision   $x_pool_decision always;
            proxy_next_upstream http_429 non_idempotent;
            proxy_next_upstream_timeout 30s;   # submissions answer in <1s; 429-hops are cheap
            proxy_next_upstream_tries 0;       # bounded by pool size per pass
            proxy_read_timeout 120s;   # submission returns immediately (poll via GET)
            proxy_intercept_errors on;
            error_page 429 = @bridge_full;
            error_page 500 502 503 504 = @bridge_full;
        }

        # Jobs list read — plain pool passthrough, no capacity gate.
        location @jobs_read {
            proxy_pass http://$backend_pool;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header X-Backend-Pool $backend_pool always;
            add_header X-Bridge-Server "primary" always;
            error_page 500 502 503 504 = @bridge_full;
        }

        # Production-priority job submission — dedicated pool; same 429-only
        # retry contract as the normal-pool jobs location (the placement veto
        # makes the 429-hop double-dispatch-free; error/timeout stays no-retry).
        location @production_jobs {
            proxy_pass http://claude_production;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            add_header X-Backend-Pool claude_production always;
            add_header X-Bridge-Server "primary" always;
            proxy_next_upstream http_429 non_idempotent;
            proxy_next_upstream_timeout 30s;
            proxy_next_upstream_tries 0;
            proxy_read_timeout 120s;
            proxy_intercept_errors on;
            error_page 429 = @bridge_full;
            error_page 500 502 503 504 = @bridge_full;
        }

        # =======================================================================
        # Default — Pool-basiertes Routing
        #
        # Also handles convert-html-to-docx, convert-pdf-to-html-direct,
        # document/convert and privacy/smart-anonymize (see the comment on the
        # chat/completions|research location above for why those are
        # deliberately NOT in the non_idempotent-retry SSE location).
        # =======================================================================
        location / {
            proxy_pass http://$backend_pool;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Upstream-Server $upstream_addr always;
            add_header X-Backend-Pool $backend_pool always;
            add_header X-Bridge-Server "primary" always;

            proxy_set_header Connection "";
            proxy_set_header Accept-Encoding "";
            chunked_transfer_encoding on;

            # Capacity contract — see comment in chat/research location.
            error_page 500 502 503 504 = @bridge_full;
        }

        # =======================================================================
        # @pool_exhausted_response — emitted when Lua pool_router finds no eligible account
        # (all accounts at weekly cap, in cooldown, or rate-limited simultaneously).
        # Entered via ngx.exec() from the access-phase guard in the gate
        # locations (NOT the old rewrite-phase if(), which could never fire).
        location @pool_exhausted_response {
            internal;
            default_type application/json;
            content_by_lua_block {
                ngx.status = 429
                ngx.header["Retry-After"]       = "30"
                ngx.header["X-Bridge-Capacity"] = "pool_exhausted"
                ngx.header["X-Upstream-Status"] = "0"
                ngx.header["Content-Type"]      = "application/json"
                ngx.print(string.format(
                    '{"error":{"message":"[Bridge nginx] Bridge capacity full — all workers exhausted. Retry in ~30s.",' ..
                    '"type":"api_error","code":429,"source":"bridge_nginx","bridge_type":"pool_exhausted",' ..
                    '"reason":"all_pool_exhausted","retryable":true,"retry_after_s":30,' ..
                    '"bridge_worker":"nginx-lb","upstream_status":0,"timestamp":0}}'
                ))
            }
        }

        # @bridge_full — Differentiated error envelope (Autobahn-Prinzip)
        # =======================================================================
        # Triggered by error_page directives in proxied locations.
        # Returns the CORRECT HTTP status per upstream error type — not always 429.
        #
        # Decision matrix:
        #   target_worker == "unavailable"  → 429  pool_exhausted        (Lua: no eligible account)
        #   X-Priority: production          → 429  all_workers_exhausted (production pool after retries)
        #   upstream 429                    → 429  rate_limited          (real Anthropic rate-limit)
        #   upstream 5xx / error / timeout  → 503  capacity_busy         (all workers exhausted after retry)
        #
        # Envelope keys on `error.reason` for SDK-level branching.
        # X-Upstream-Status header carries the original upstream code for monitors.
        location @bridge_full {
            internal;
            default_type application/json;
            content_by_lua_block {
                local upstream_status_raw = ngx.var.upstream_status or ""
                -- $upstream_status may be comma-separated when proxy_next_upstream
                -- retried multiple workers (e.g., "429, 429, 429"). Take the last code.
                local last_status_str = upstream_status_raw:match("(%d+)%s*$") or ""
                local upstream_status = tonumber(last_status_str) or 502
                local target_worker   = ngx.var.target_worker or ""
                local x_priority      = ngx.var.http_x_priority or ""

                local http_status, retry_after_s, bridge_type, reason, msg

                if target_worker == "unavailable"
                        or ngx.var.x_pool_decision == "all_unavail_overflow" then
                    -- Lua pool_router found no eligible account → real pool
                    -- exhaustion. "all_unavail_overflow" is the same condition
                    -- on an overflow-capable endpoint: the request was routed
                    -- to a worker so the app could pick the non-pool path, and
                    -- reaching @bridge_full means it could not — so it is pool
                    -- exhaustion too, NOT the "anthropic_rate_limit" that the
                    -- upstream-429 branch below would otherwise label it.
                    http_status   = 429
                    retry_after_s = 30
                    bridge_type   = "pool_exhausted"
                    reason        = "all_pool_exhausted"
                    msg           = "Bridge capacity full — all workers exhausted. Retry in ~30s."
                elseif x_priority == "production" then
                    -- Production pool: cross-worker retry exhausted all options
                    http_status   = 429
                    retry_after_s = 30
                    bridge_type   = "capacity_full"
                    reason        = "all_workers_exhausted"
                    msg           = "Bridge production pool exhausted after retries. Retry in ~30s."
                elseif upstream_status == 429 then
                    -- Real Anthropic 429 from the chosen worker
                    http_status   = 429
                    retry_after_s = 30
                    bridge_type   = "rate_limited"
                    reason        = "anthropic_rate_limit"
                    msg           = "Anthropic rate limit on selected worker. Retry in ~30s."
                else
                    -- All 5xx (500, 502, 503, 504): unified 503 capacity_busy (Autobahn contract).
                    -- proxy_next_upstream already exhausted all workers before reaching here.
                    http_status   = 503
                    retry_after_s = 10
                    bridge_type   = "capacity_busy"
                    reason        = "upstream_" .. tostring(upstream_status)
                    msg           = "Bridge temporarily at capacity. Retry in ~10s."
                end

                local err_type = (bridge_type == "rate_limited") and "rate_limit_error" or "api_error"

                ngx.status                      = http_status
                ngx.header["Retry-After"]       = tostring(retry_after_s)
                ngx.header["X-Bridge-Capacity"] = bridge_type
                ngx.header["X-Upstream-Status"] = upstream_status_raw
                ngx.header["Content-Type"]      = "application/json"
                ngx.print(string.format(
                    '{"error":{"message":"[Bridge nginx] %s","type":"%s","code":"%d",' ..
                    '"source":"bridge_nginx","bridge_type":"%s","reason":"%s",' ..
                    '"retryable":true,"retry_after_s":%d,"bridge_worker":"nginx-lb",' ..
                    '"upstream_status":%d,"timestamp":0}}',
                    msg, err_type, http_status,
                    bridge_type, reason,
                    retry_after_s, upstream_status
                ))
            }
        }
    }
}
