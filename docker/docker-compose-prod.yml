# =============================================================================
# PRODUCTION RESERVE Bridge — Server 2 (kleiner Hetzner)
# Minimale Konfiguration: 1 Worker + 1 Privacy/Docling + nginx
# =============================================================================
#
# Dieser Server ist die Production-Reserve.
# - Kunden-Workflows werden hierhin geroutet (X-Priority: production)
# - Wenn Server 1 abstuerzt, uebernimmt dieser Server ALLES
# - Wenn dieser Server abstuerzt, faellt Server 1 zurueck auf lokale Worker
#
# Setup auf neuem Server:
#   1. Git clone + secrets kopieren
#   2. BRIDGE_PRIMARY_HOST env var setzen (IP von Server 1)
#   3. docker compose -f docker-compose-prod.yml up -d --build
#
# =============================================================================

services:
  # ===========================================================================
  # NGINX — Eigener Load Balancer mit Fallback auf Server 1
  # ===========================================================================
  nginx:
    image: nginx:alpine
    container_name: eco-prod-lb
    ports:
      - "8000:80"
    volumes:
      - ./nginx-prod.conf:/etc/nginx/templates/nginx.conf.template:ro
    environment:
      - BRIDGE_PRIMARY_HOST=${BRIDGE_PRIMARY_HOST:-127.0.0.1}
    # envsubst ersetzt ${BRIDGE_PRIMARY_HOST} in nginx.conf, dann Start
    command: ["/bin/sh", "-c", "rm -f /etc/nginx/conf.d/default.conf && envsubst '$$BRIDGE_PRIMARY_HOST' < /etc/nginx/templates/nginx.conf.template > /etc/nginx/nginx.conf && nginx -g 'daemon off;'"]
    depends_on:
      - worker-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - bridge-prod-net

  # ===========================================================================
  # Production Worker — Dedizierter Account
  # ===========================================================================
  worker-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: eco-prod-worker
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - prod-logs:/app/logs
      - prod-instances:/app/instances
      - ~/eco-research-output:/app/research_output
    secrets:
      - claude_token_prod
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN_FILE=/run/secrets/claude_token_prod
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - LOG_TO_FILE=true
      - FILTER_SENSITIVE_DATA=true
      - INSTANCE_NAME=worker-prod
      - CLAUDE_CWD=/app/instances
      - DISABLE_COACH_MCP=true
      - MAX_TIMEOUT=2400000
      - CLAUDE_PERMISSION_MODE=bypassPermissions
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ANTHROPIC_VISION_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PRIVACY_ENABLED=true
      - PRIVACY_LANGUAGE=de
      - PRIVACY_LOG_DETECTIONS=false
      - SKIP_SDK_VERIFICATION=true
      - RATE_LIMIT_ENABLED=false
      - PRIVACY_SERVICE_URL=http://privacy-prod:8100
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    networks:
      - bridge-prod-net

  # ===========================================================================
  # Production Privacy + Docling Service
  # ===========================================================================
  privacy-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.privacy-pdf
    container_name: eco-prod-privacy
    expose:
      - "8100"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    environment:
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - PRIVACY_ENABLED=true
      - PRIVACY_LANGUAGE=de
      - PRIVACY_LOG_DETECTIONS=false
      - BRIDGE_SELF_URL=http://nginx:80/v1/chat/completions
      - API_KEY=${API_KEY:-}
      - CONVERTAPI_SECRET=${CONVERTAPI_SECRET}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - bridge-prod-net

  # ===========================================================================
  # Metrics Reader — decoupled read-only JSONL metrics service
  # ===========================================================================
  metrics-reader-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.metrics-reader
    container_name: eco-prod-metrics-reader
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    volumes:
      - prod-logs:/app/logs:ro
    environment:
      - METRICS_DIR=/app/logs
      - LOG_LEVEL=INFO
      - TZ=Europe/Vienna
      - BRIDGE_WORKERS=worker-prod
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - bridge-prod-net

networks:
  bridge-prod-net:
    driver: bridge

volumes:
  prod-logs:
    driver: local
  prod-instances:
    driver: local

secrets:
  claude_token_prod:
    file: ../secrets/claude_token_prod.txt
