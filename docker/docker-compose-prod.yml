# =============================================================================
# PRODUCTION RESERVE Bridge — Server 2 (kleiner Hetzner)
# Minimale Konfiguration: 1 Worker + 1 Privacy/Docling + nginx
# =============================================================================
#
# Dieser Server ist die Production-Reserve.
# - Kunden-Workflows werden hierhin geroutet (X-Priority: production)
# - Wenn Server 1 abstuerzt, uebernimmt dieser Server ALLES
# - Wenn dieser Server abstuerzt, faellt Server 1 zurueck auf lokale Worker
#
# Setup auf neuem Server:
#   1. Git clone + secrets kopieren
#   2. BRIDGE_PRIMARY_HOST env var setzen (IP von Server 1)
#   3. docker compose -f docker-compose-prod.yml up -d --build
#
# =============================================================================

services:
  # ===========================================================================
  # NGINX — Eigener Load Balancer mit Fallback auf Server 1
  # ===========================================================================
  nginx:
    # SINGLE SOURCE (ADR-0006 B/C): production now runs the SAME OpenResty+Lua
    # image + the SAME docker/nginx.conf as primary. nginx-prod.conf is gone; the
    # only per-bridge difference is upstreams-prod.conf (worker set + backup host).
    # This gives the customer bridge the intelligent Lua account pool-router.
    build:
      context: ..
      dockerfile: docker/Dockerfile.nginx-lb
    container_name: wt-prod-lb
    ports:
      - "8000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      # Per-topology worker set: worker-sahori/worker-kurt + dev-bridge backup
      # (Model-B). envsubst'd to /tmp/upstreams.conf in the command below.
      - ./upstreams-prod.conf:/etc/nginx/upstreams.conf:ro
      - ./routes-metrics-reader.conf:/etc/nginx/routes-metrics-reader.conf:ro
      - ./routes-platform-api.conf:/etc/nginx/routes-platform-api.conf:ro
      - ../logs/nginx:/var/log/nginx
    environment:
      # Backup bridge = the dev/primary bridge (Model-B fallback for the default
      # pool). nginx.conf references ${BRIDGE_BACKUP_HOST}.
      - BRIDGE_BACKUP_HOST=${BRIDGE_PRIMARY_HOST:-127.0.0.1}
      - BRIDGE_ID=${BRIDGE_ID:-prod}
      # Worker set for docker/lua/pool_router.lua (env BRIDGE_WORKERS in nginx.conf).
      - BRIDGE_WORKERS=worker-sahori,worker-kurt
    # envsubst nginx.conf + the upstreams include (both need ${BRIDGE_BACKUP_HOST}),
    # then start openresty. Same mechanism as the primary compose.
    command: ["/bin/sh", "-c", "envsubst '$$BRIDGE_BACKUP_HOST $$BRIDGE_ID' < /etc/nginx/nginx.conf > /tmp/nginx.conf && envsubst '$$BRIDGE_BACKUP_HOST' < /etc/nginx/upstreams.conf > /tmp/upstreams.conf && openresty -c /tmp/nginx.conf -g 'daemon off;'"]
    depends_on:
      - worker-sahori
      - worker-kurt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - bridge-prod-net

  # ===========================================================================
  # Production Worker — Sahori (was: worker-prod with claude_token_prod)
  # ===========================================================================
  worker-sahori:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: wt-prod-worker-sahori
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - prod-logs:/app/logs
      - prod-instances:/app/instances
      - ~/wt-research-output:/app/research_output
    secrets:
      - claude_token_sahori
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN_FILE=/run/secrets/claude_token_sahori
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - LOG_TO_FILE=true
      - FILTER_SENSITIVE_DATA=true
      - INSTANCE_NAME=worker-sahori
      - BRIDGE_GENERIC_JOBS_ENABLED=true
      - CLAUDE_CWD=/app/instances
      - DISABLE_COACH_MCP=true
      - MAX_TIMEOUT=2400000
      # Anthropic-client request timeout INSIDE the claude CLI subprocess.
      # Unset, the CLI defaults to 600000ms (10 min) and aborts slow streams
      # mid-generation -> partial content without result message (silent
      # truncation upstream of MAX_TIMEOUT). Align with MAX_TIMEOUT so the
      # bridge's own asyncio timeout is the single governing limit.
      - API_TIMEOUT_MS=2400000
      # Central output-token ceiling (target architecture 2026-06-12): app
      # code sends NO max_tokens (the SDK path ignores it anyway) — this env
      # on the CLI subprocess is the single limit. 64000 = Sonnet 4.5 /
      # Haiku 4.5 ceiling (Opus 4.8 allows more). Without it the CLI default
      # (32000) silently caps long structured outputs.
      - CLAUDE_CODE_MAX_OUTPUT_TOKENS=64000
      - CLAUDE_PERMISSION_MODE=bypassPermissions
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ANTHROPIC_VISION_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # STT / Whisper EU data-residency (GDPR) — default openai (US, backward-compat).
      # Flip STT_PROVIDER=azure + provision AZURE_* for EU (Sweden/France Central),
      # or set OPENAI_STT_BASE_URL=https://eu.api.openai.com/v1 for OpenAI EU residency.
      - STT_PROVIDER=${STT_PROVIDER:-openai}
      - OPENAI_STT_BASE_URL=${OPENAI_STT_BASE_URL:-}
      - AZURE_OPENAI_STT_ENDPOINT=${AZURE_OPENAI_STT_ENDPOINT:-}
      - AZURE_OPENAI_STT_KEY=${AZURE_OPENAI_STT_KEY:-}
      - AZURE_OPENAI_STT_DEPLOYMENT=${AZURE_OPENAI_STT_DEPLOYMENT:-}
      - AZURE_OPENAI_STT_API_VERSION=${AZURE_OPENAI_STT_API_VERSION:-}
      - PRIVACY_ENABLED=true
      - PRIVACY_LANGUAGE=de
      - PRIVACY_LOG_DETECTIONS=false
      - SKIP_SDK_VERIFICATION=true
      - RATE_LIMIT_ENABLED=false
      - DEFAULT_PRIVACY_MODE=none
      # Routed to the dev-bridge privacy service (Tailscale): the 7GB prod host
      # cannot hold the ~13GB Flair model. dev host has 30GB. See dev compose.
      - PRIVACY_SERVICE_URL=http://100.112.98.39:8100
      - BRIDGE_ANONYMIZE_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    restart: unless-stopped
    networks:
      - bridge-prod-net

  # ===========================================================================
  # Production Worker — Kurt
  # ===========================================================================
  worker-kurt:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    container_name: wt-prod-worker-kurt
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    volumes:
      - prod-logs:/app/logs
      - prod-instances:/app/instances
      - ~/wt-research-output:/app/research_output
    secrets:
      - claude_token_kurt
    environment:
      - CLAUDE_CODE_OAUTH_TOKEN_FILE=/run/secrets/claude_token_kurt
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - LOG_TO_FILE=true
      - FILTER_SENSITIVE_DATA=true
      - INSTANCE_NAME=worker-kurt
      - BRIDGE_GENERIC_JOBS_ENABLED=true
      - CLAUDE_CWD=/app/instances
      - DISABLE_COACH_MCP=true
      - MAX_TIMEOUT=2400000
      # Anthropic-client request timeout INSIDE the claude CLI subprocess.
      # Unset, the CLI defaults to 600000ms (10 min) and aborts slow streams
      # mid-generation -> partial content without result message (silent
      # truncation upstream of MAX_TIMEOUT). Align with MAX_TIMEOUT so the
      # bridge's own asyncio timeout is the single governing limit.
      - API_TIMEOUT_MS=2400000
      # Central output-token ceiling (target architecture 2026-06-12): app
      # code sends NO max_tokens (the SDK path ignores it anyway) — this env
      # on the CLI subprocess is the single limit. 64000 = Sonnet 4.5 /
      # Haiku 4.5 ceiling (Opus 4.8 allows more). Without it the CLI default
      # (32000) silently caps long structured outputs.
      - CLAUDE_CODE_MAX_OUTPUT_TOKENS=64000
      - CLAUDE_PERMISSION_MODE=bypassPermissions
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - ANTHROPIC_VISION_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      # STT / Whisper EU data-residency (GDPR) — default openai (US, backward-compat).
      # Flip STT_PROVIDER=azure + provision AZURE_* for EU (Sweden/France Central),
      # or set OPENAI_STT_BASE_URL=https://eu.api.openai.com/v1 for OpenAI EU residency.
      - STT_PROVIDER=${STT_PROVIDER:-openai}
      - OPENAI_STT_BASE_URL=${OPENAI_STT_BASE_URL:-}
      - AZURE_OPENAI_STT_ENDPOINT=${AZURE_OPENAI_STT_ENDPOINT:-}
      - AZURE_OPENAI_STT_KEY=${AZURE_OPENAI_STT_KEY:-}
      - AZURE_OPENAI_STT_DEPLOYMENT=${AZURE_OPENAI_STT_DEPLOYMENT:-}
      - AZURE_OPENAI_STT_API_VERSION=${AZURE_OPENAI_STT_API_VERSION:-}
      - PRIVACY_ENABLED=true
      - PRIVACY_LANGUAGE=de
      - PRIVACY_LOG_DETECTIONS=false
      - SKIP_SDK_VERIFICATION=true
      - RATE_LIMIT_ENABLED=false
      - DEFAULT_PRIVACY_MODE=none
      # Routed to the dev-bridge privacy service (Tailscale): the 7GB prod host
      # cannot hold the ~13GB Flair model. dev host has 30GB. See dev compose.
      - PRIVACY_SERVICE_URL=http://100.112.98.39:8100
      - BRIDGE_ANONYMIZE_ENABLED=true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    restart: unless-stopped
    networks:
      - bridge-prod-net

  # ===========================================================================
  # Privacy + Docling Service — REMOVED from PROD (2026-06-26).
  # Flair ner-german-large needs ~13GB; this 7GB host OOM'd at the 5G limit.
  # PROD now routes smart-anonymize to the DEV-bridge privacy service over
  # Tailscale: see PRIVACY_SERVICE_URL=http://100.112.98.39:8100 on the workers.
  # (dev compose publishes wt-privacy-pdf-service on the dev Tailscale IP.)
  # ===========================================================================

  # ===========================================================================
  # Metrics Reader — decoupled read-only JSONL metrics service
  # ===========================================================================
  metrics-reader-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.metrics-reader
    container_name: wt-prod-metrics-reader
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    volumes:
      - prod-logs:/app/logs:ro
    environment:
      - METRICS_DIR=/app/logs
      - LOG_LEVEL=INFO
      - TZ=Europe/Vienna
      - BRIDGE_WORKERS=worker-sahori,worker-kurt
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      bridge-prod-net:
        # Canonical DNS name the consumers hard-code: account_router.py
        # (BRIDGE_METRICS_READER_URL default) + docker/lua/pool_router.lua +
        # nginx.conf all resolve `http://metrics-reader:8000`. The dev compose
        # names the service `metrics-reader`; prod named it `metrics-reader-prod`,
        # so that hostname did NOT resolve in bridge-prod-net → every sandbox
        # lease failed `pool_state_unavailable` (503) → app showed "start 500".
        # Alias restores the canonical name without diverging the code per-env.
        aliases:
          - metrics-reader

networks:
  bridge-prod-net:
    driver: bridge

volumes:
  prod-logs:
    driver: local
  prod-instances:
    driver: local

secrets:
  claude_token_sahori:
    file: ../secrets/claude_token_prod.txt
  claude_token_kurt:
    file: ../secrets/claude_token_kurt.txt
