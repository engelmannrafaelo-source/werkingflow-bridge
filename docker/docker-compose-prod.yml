  # ===========================================================================
  # Privacy + Docling Service — REMOVED from PROD (2026-06-26).
  # Flair ner-german-large needs ~13GB; this 7GB host OOM'd at the 5G limit.
  # PROD now routes smart-anonymize to the dedicated GPU privacy host
  # gpu-privacy-1 over Tailscale: see PRIVACY_SERVICE_URL=http://100.65.149.39:8100
  # on the workers (2026-08-05 cutover, was the dev-bridge CPU instance
  # 100.112.98.39:8100 before — kept as rollback target, see workers above).
  # ===========================================================================

  # ===========================================================================
  # Metrics Reader — decoupled read-only JSONL metrics service
  # ===========================================================================
  metrics-reader-prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile.metrics-reader
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    container_name: wt-prod-metrics-reader
    expose:
      - "8000"
    deploy:
      resources:
        limits:
          # 22.07. (dev-Host): Heavy-Endpoint-Polls OOM-killten den Child am
          # 1536M-Limit → Reader taub → Sandbox-Leases 503. Prod poll-aermer,
          # aber gleiche Codepfade — Headroom analog erhoeht (512M→1024M).
          memory: 1024M
        reservations:
          memory: 128M
    volumes:
      - prod-logs:/app/logs:ro
    environment:
      - METRICS_DIR=/app/logs
      - LOG_LEVEL=INFO
      - TZ=Europe/Vienna
      - BRIDGE_WORKERS=worker-sahori,worker-kurt,worker-coach,worker-erk
      # ADR-0009 (worker-host separation): optional "name=host:port,..."
      # override for polling a worker that no longer lives on THIS host —
      # empty here (all four workers still co-located) means every worker
      # resolves via same-host DNS, exactly as before this variable existed.
      # Populate at the gated cutover; keep in sync with
      # generate-bridge-upstreams.sh's PROD_WORKER_TARGETS (nginx-side twin).
      - BRIDGE_WORKER_TARGETS=${BRIDGE_WORKER_TARGETS:-}
    healthcheck:
      # Echten Aggregationspfad pruefen, nicht nur den uvicorn-Master (siehe
      # dev-Compose): 4 Worker-Polls x 3s Worst-Case → max-time 16s. War 8s
      # (fuer 2 Worker gerechnet); mit dem 2->4-Ausbau haette der Reader bei
      # langsamen Polls grundlos auf unhealthy gedreht.
      test: ["CMD", "curl", "-fsS", "--max-time", "16", "http://localhost:8000/v1/metrics/account-pool-state"]
      interval: 30s
      # Muss ueber --max-time liegen, sonst killt Docker die Probe vorher
      # und das groessere curl-Budget waere wirkungslos.
      timeout: 20s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      bridge-prod-net:
        # Canonical DNS name the consumers hard-code: account_router.py
        # (BRIDGE_METRICS_READER_URL default) + docker/lua/pool_router.lua +
        # nginx.conf all resolve `http://metrics-reader:8000`. The dev compose
        # names the service `metrics-reader`; prod named it `metrics-reader-prod`,
        # so that hostname did NOT resolve in bridge-prod-net → every sandbox
        # lease failed `pool_state_unavailable` (503) → app showed "start 500".
        # Alias restores the canonical name without diverging the code per-env.
        aliases:
          - metrics-reader

networks:
  bridge-prod-net:
    driver: bridge

volumes:
  prod-logs:
    driver: local
  prod-instances:
    driver: local

secrets:
  claude_token_sahori:
    file: ../secrets/claude_token_prod.txt
  claude_token_kurt:
    file: ../secrets/claude_token_kurt.txt
  claude_token_coach:
    file: ../secrets/claude_token_coach.txt
  claude_token_erk:
    file: ../secrets/claude_token_erk.txt
