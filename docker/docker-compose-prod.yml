    environment:
      - CLAUDE_CODE_OAUTH_TOKEN_FILE=/run/secrets/claude_token_kurt
      - TZ=Europe/Vienna
      - LOG_LEVEL=INFO
      - LOG_TO_FILE=true
      - FILTER_SENSITIVE_DATA=true
      - INSTANCE_NAME=worker-kurt
      - BRIDGE_GENERIC_JOBS_ENABLED=true
      # OA-Scholarly-Schicht: legale OA-Volltext-Injektion bei research_mode=academic
      # (OpenAlex/CORE, fail-soft). Prod-Aktivierung Rafael-Go 2026-07-25.
