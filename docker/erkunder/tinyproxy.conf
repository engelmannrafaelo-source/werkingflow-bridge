User nobody
Group nogroup
Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 64
# tinyproxy drops to nobody before opening this file. erkunder-proxy creates it
# in writable /tmp with that ownership and mirrors it to the container log.
LogFile "/tmp/tinyproxy.log"
LogLevel Connect
PidFile "/tmp/tinyproxy.pid"
Filter "/etc/erkunder/tinyproxy.filter"
FilterURLs Off
FilterType ere
FilterCaseSensitive Off
FilterDefaultDeny Yes
ConnectPort 443
DisableViaHeader Yes
