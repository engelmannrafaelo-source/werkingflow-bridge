# The per-topology worker set for the SHARED docker/nginx.conf (ADR-0006 B/C).
# This is the ONLY nginx difference between the two bridges. ${BRIDGE_BACKUP_HOST}
# is resolved by the compose envsubst before nginx loads this file.
#   topology : primary
#   workers  : worker1 worker2 worker3 worker4
# Regenerate with the generator; never hand-edit. bridge-parity-check.sh verifies
# the in-container copy matches this repo file.
# =============================================================================

# Round-robin default pool (used by /health, Lua-routed /v1 SSE, default /).
upstream claude_workers {
    server worker1:8000 weight=1 max_fails=0;
    server worker2:8000 weight=1 max_fails=0;
    server worker3:8000 weight=1 max_fails=0;
    server worker4:8000 weight=1 max_fails=0;
    keepalive 32;
}

# Production-priority pool (X-Priority: production).
# Targets the PROD bridge (${BRIDGE_BACKUP_HOST}) FIRST — local dev
# workers are the overflow path, used only if the prod bridge itself
# is unreachable/exhausted (Rafael, 2026-08-31: production-priority
# traffic must not compete with dev-time load for dev-worker capacity).
upstream claude_production {
    server ${BRIDGE_BACKUP_HOST}:8000 weight=1 max_fails=1 fail_timeout=10s;
    server worker1:8000 backup max_fails=0;
    server worker2:8000 backup max_fails=0;
    server worker3:8000 backup max_fails=0;
    server worker4:8000 backup max_fails=0;
    keepalive 16;
}

# LLM-pool selection for the account-consuming paths (chat/research +
# POST /v1/jobs) — consumed by the shared nginx.conf (ADR-0010).
# $bridge_hopped (nginx.conf) is 1 when the request already crossed a
# bridge once (X-Bridge-Hop); hopped traffic is ALWAYS served from the
# local tier — that is the one-hop loop guard.
# primary: ADR-0010's default-pool tiering is PAUSED (2026-08-31,
# ~1h nach Go-Live zurueckgenommen): Ausfuehrung auf Level 1 heisst
# Budget-Gate auf der PROD-DB — Dev-Identitaeten existieren dort
# nicht und werden als JIT-Schatten-Trials angelegt; gemessen als
# UPSTREAM_HTTP_402 trial_expired fuer einen gesunden Dev-User
# (DevOps-Session a0d8b084). Bis die Budget-Domaene vereinheitlicht
# ist (ADR-0010 'Voraussetzung'), reitet nur X-Priority den
# Level-1-Pool — deren Nutzer SIND Prod-Nutzer.
map "$bridge_hopped:$http_x_priority" $llm_backend_pool {
    "0:production"  claude_production;
    default         claude_workers;
}
