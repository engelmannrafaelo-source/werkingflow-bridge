[tool.poetry]
name = "claude-code-openai-wrapper"
version = "1.0.0"
description = "OpenAI API-compatible wrapper for Claude Code"
authors = ["Richard Atkinson <richardatk01@gmail.com>"]
readme = "README.md"
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
pydantic = {extras = ["email"], version = "^2.10.0"}
python-dotenv = "^1.0.1"
httpx = "^0.27.2"
sse-starlette = "^2.1.3"
python-multipart = "^0.0.18"
claude-code-sdk = ">=0.0.22"
slowapi = "^0.1.9"
tavily-python = "^0.7.12"
psutil = "^6.1.0"
pytz = ">=2024.1"
# Bridge platform-layer deps (Postgres + JWT + password hashing)
asyncpg = "^0.29.0"
bcrypt = "^4.2.0"
pyjwt = "^2.9.0"
# Invoice PDF rendering (HTML → PDF via WeasyPrint + Cairo/Pango)
# Requires system packages: libpango-1.0-0, libpangoft2-1.0-0, libpangocairo-1.0-0,
# libcairo2, libgdk-pixbuf2.0-0, shared-mime-info, fonts-liberation — see Dockerfile.
weasyprint = "^62.0"

# Mollie payment integration (LiveMollieAdapter — checkout, subscriptions, webhooks)
mollie-api-python = "^3.0"

# AWS Bedrock support (DSGVO-compliant backend)
boto3 = "^1.35.0"

# Privacy/DSGVO compliance (Presidio-based PII anonymization)
presidio-analyzer = {version = "^2.2.0", optional = true}
presidio-anonymizer = {version = "^2.2.0", optional = true}

# PDF conversion (Docling — local, DSGVO-safe)
docling = {version = "^2.80.0", optional = true}

# Universal document conversion (XLSX/CSV/HTML/MSG/EML)
# All optional so the lightweight worker container does not pull them.
openpyxl = {version = "^3.1.5", optional = true}
pandas = {version = "^2.2.0", optional = true}
tabulate = {version = "^0.9.0", optional = true}  # required by pandas.DataFrame.to_markdown
markdownify = {version = "^0.13.1", optional = true}
"extract-msg" = {version = "^0.50.0", optional = true}

[tool.poetry.extras]
privacy = ["presidio-analyzer", "presidio-anonymizer"]
pdf = ["docling"]
documents = ["openpyxl", "pandas", "tabulate", "markdownify", "extract-msg"]

[tool.poetry.group.dev.dependencies]
black = "^24.0.0"
pytest = "^8.0.0"
pytest-asyncio = "^0.23.0"
requests = "^2.32.0"
openai = "^1.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.poetry.scripts]
claude-wrapper = "src.main:run_server"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]  # KRITISCH: Fügt project root zu PYTHONPATH hinzu
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"